uching these lines</text><circle cx="313" cy="170" r="7" fill="#2c4f9e" stroke="#1b2f66" stroke-width="1.6"/><text x="334.0" y="174.0" font-size="11" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">blue-stained (trypan blue) = dead,</text><text x="334.0" y="188.0" font-size="11" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">not counted in a viable count</text><text x="300.0" y="222.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Count here: 10 inside + 3 on counted edges</text><text x="300.0" y="238.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">= 13 live cells</text><text x="300.0" y="262.0" font-size="11" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Volume = 0.25 × 0.25 × 0.1 = 0.00625 mm³</text><text x="300.0" y="278.0" font-size="11" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">= 6.25 × 10⁻⁶ cm³</text></svg>