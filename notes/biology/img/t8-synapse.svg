circle cx="282.0" cy="204.0" r="8.5" fill="#1d6fb8"/><text x="282.0" y="208.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">6</text><circle cx="478.0" cy="32.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="36.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">1</text><text x="492.0" y="36.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Action potential arrives at the</text><text x="492.0" y="49.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">synaptic knob</text><circle cx="478.0" cy="70.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="74.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">2</text><text x="492.0" y="74.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Voltage-gated Ca²⁺ channels open;</text><text x="492.0" y="87.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Ca²⁺ diffuses into the knob</text><circle cx="478.0" cy="108.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="112.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">3</text><text x="492.0" y="112.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Vesicles move to and fuse with the presynaptic</text><text x="492.0" y="125.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">membrane: ACh released by exocytosis</text><circle cx="478.0" cy="146.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="150.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">4</text><text x="492.0" y="150.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">ACh diffuses across the cleft and binds to</text><text x="492.0" y="163.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">receptors on the postsynaptic membrane</text><circle cx="478.0" cy="184.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="188.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">5</text><text x="492.0" y="188.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Na⁺ channels open, Na⁺ diffuses in:</text><text x="492.0" y="201.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">depolarisation; threshold → action potential</text><circle cx="478.0" cy="222.0" r="8.5" fill="#1d6fb8"/><text x="478.0" y="226.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">6</text><text x="492.0" y="226.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Acetylcholinesterase hydrolyses ACh; choline</text><text x="492.0" y="239.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">is taken back into the knob and recycled</text></svg>