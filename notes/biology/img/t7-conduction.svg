<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker></defs><path d="M80,60 Q80,30 120,30 L230,30 Q250,30 250,60 L250,150 L80,150 Z" fill="#fdecea" stroke="#1b1f23" stroke-width="1.6"/><path d="M262,60 Q262,30 290,30 L400,30 Q430,30 430,60 L430,150 L262,150 Z" fill="#fdecea" stroke="#1b1f23" stroke-width="1.6"/><path d="M80,166 L430,166 C430,260 330,340 256,382 C182,340 80,260 80,166 Z" fill="#fbe3e1" stroke="#1b1f23" stroke-width="1.6"/><rect x="250" y="166" width="12" height="180" fill="#f3c9c5" stroke="#1b1f23" stroke-width="1"/><rect x="76" y="150" width="358" height="16" fill="#9aa3ad"/><text x="160.0" y="162.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">non-conducting fibrous tissue</text><text x="165.0" y="92.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">right atrium</text><text x="346.0" y="92.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">left atrium</text><text x="160.0" y="236.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">right</text><text x="160.0" y="250.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">ventricle</text><text x="352.0" y="236.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">left</text><text x="352.0" y="250.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">ventricle</text><circle cx="104" cy="52" r="9" fill="#b3261e"/><circle cx="236" cy="138" r="8" fill="#1d6fb8"/><path d="M134,52 A30,30 0 0 1 104,82" fill="none" stroke="#b3261e" stroke-width="1" stroke-dasharray="3 3"/><path d="M164,52 A60,60 0 0 1 104,112" fill="none" stroke="#b3261e" stroke-width="1" stroke-dasharray="3 3"/><path d="M194,52 A90,90 0 0 1 104,142" fill="none" stroke="#b3261e" stroke-width="1" stroke-dasharray="3 3"/><path d="M244,140 L256,170 L256,340" fill="none" stroke="#1f7a4d" stroke-width="4"/><path d="M256,340 C205,332 106,262 94,180" fill="none" stroke="#1f7a4d" stroke-width="2.4"/><path d="M256,340 C307,332 406,262 418,180" fill="none" stroke="#1f7a4d" stroke-width="2.4"/><line x1="160.0" y1="286.0" x2="142.0" y2="268.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="352.0" y1="286.0" x2="370.0" y2="268.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="132" y1="318" x2="168" y2="300" stroke="#5b6470" stroke-width="0.9"/><circle cx="462" cy="40" r="10" fill="#b3261e"/><text x="462.0" y="44.0" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">1</text><text x="480.0" y="44.0" font-size="10.3" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">SAN (wall of right atrium) depolarises</text><text x="480.0" y="58.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">spontaneously: wave spreads over both atria</text><text x="480.0" y="72.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">→ atrial systole</text><circle cx="462" cy="130" r="10" fill="#1d6fb8"/><text x="462.0" y="134.0" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">2</text><text x="480.0" y="134.0" font-size="10.3" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Fibrous tissue stops the wave reaching the</text><text x="480.0" y="148.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">ventricles; the AVN picks it up and delays</text><text x="480.0" y="162.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">it (about 0.1 s) so the atria finish emptying</text><circle cx="462" cy="220" r="10" fill="#1f7a4d"/><text x="462.0" y="224.0" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">3</text><text x="480.0" y="224.0" font-size="10.3" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Bundle of His carries the impulse down</text><text x="480.0" y="238.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">the septum to the apex</text><circle cx="462" cy="290" r="10" fill="#1f7a4d"/><text x="462.0" y="294.0" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">4</text><text x="480.0" y="294.0" font-size="10.3" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Purkyne fibres spread it up the ventricle</text><text x="480.0" y="308.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">walls: ventricles contract from the apex</text><text x="480.0" y="322.0" font-size="10.3" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">upwards → blood pushed into the arteries</text><text x="104.0" y="22.0" font-size="10.5" font-weight="800" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">SAN</text><text x="210.0" y="132.0" font-size="10.5" font-weight="800" text-anchor="end" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">AVN</text><text x="266.0" y="270.0" font-size="10" font-weight="700" text-anchor="start" fill="#1f7a4d" font-family="Segoe UI, Arial, sans-serif">bundle of His</text><text x="130.0" y="330.0" font-size="10" font-weight="700" text-anchor="end" fill="#1f7a4d" font-family="Segoe UI, Arial, sans-serif">Purkyne fibres</text><text x="256.0" y="396.0" font-size="10" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">apex</text></svg>