<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- bench -->
<line x1="16" y1="404" x2="704" y2="404" stroke="#495057" stroke-width="3"/>
<text x="704" y="430" text-anchor="end" fill="#495057">bench</text>

<!-- clamp stand -->
<g fill="#f1f3f5" stroke="#495057" stroke-width="2">
<rect x="60" y="392" width="190" height="12" rx="2"/>
<rect x="146" y="56" width="8" height="336"/>
<rect x="162" y="76" width="278" height="8"/>
<rect x="136" y="68" width="28" height="28" rx="3"/>
</g>

<!-- fibre, hook and masses -->
<line x1="400" y1="84" x2="400" y2="205" stroke="#2f9e44" stroke-width="2.5"/>
<line x1="400" y1="219" x2="400" y2="316" stroke="#495057" stroke-width="2.5"/>
<circle cx="400" cy="212" r="7" fill="none" stroke="#1d2330" stroke-width="2.2"/>
<g fill="#e7f0ff" stroke="#002b80" stroke-width="1.8">
<rect x="363" y="236" width="74" height="20" rx="3"/>
<rect x="363" y="256" width="74" height="20" rx="3"/>
<rect x="363" y="276" width="74" height="20" rx="3"/>
<rect x="363" y="296" width="74" height="20" rx="3"/>
</g>

<!-- container with soft lining -->
<rect x="326" y="344" width="148" height="60" fill="#f1f3f5"/>
<rect x="327" y="352" width="7" height="51" fill="#ffe8cc" stroke="#f08c00" stroke-width="1.2"/>
<rect x="466" y="352" width="7" height="51" fill="#ffe8cc" stroke="#f08c00" stroke-width="1.2"/>
<path d="M327 384 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 L473 384 V403 H327 Z" fill="#ffe8cc" stroke="#f08c00" stroke-width="1.5"/>
<path d="M326 344 V404 H474 V344" fill="none" stroke="#495057" stroke-width="2.5"/>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.2" fill="#495057">
<line x1="104" y1="246" x2="146" y2="246"/><circle cx="146" cy="246" r="2.5" stroke="none"/>
<line x1="250" y1="58" x2="250" y2="76"/><circle cx="250" cy="76" r="2.5" stroke="none"/>
<line x1="436" y1="146" x2="402" y2="146"/><circle cx="402" cy="146" r="2.5" stroke="none"/>
<line x1="436" y1="212" x2="407" y2="212"/><circle cx="407" cy="212" r="2.5" stroke="none"/>
<line x1="452" y1="282" x2="437" y2="282"/><circle cx="437" cy="282" r="2.5" stroke="none"/>
<line x1="490" y1="370" x2="470" y2="370"/><circle cx="470" cy="370" r="2.5" stroke="none"/>
</g>
<text x="16" y="251">clamp stand</text>
<text x="250" y="50" text-anchor="middle">arm</text>
<text x="442" y="151">plant fibre</text>
<text x="442" y="217">hook</text>
<text x="458" y="287">stack of 100 g masses</text>
<text x="496" y="367">container lined</text>
