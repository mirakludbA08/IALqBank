<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="95.0" y="24.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">1. Cut each grain across</text><ellipse cx="95" cy="120" rx="60" ry="30" fill="#f1dfae" stroke="#b7791f" stroke-width="1.6"/><ellipse cx="139" cy="124" rx="14" ry="13" fill="#e2b866" stroke="#b7791f" stroke-width="1.2"/><line x1="113" y1="74" x2="113" y2="156" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="143.0" y1="108.0" x2="155.0" y2="74.0" stroke="#5b6470" stroke-width="0.9"/><text x="157.0" y="64.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">embryo half:</text><text x="157.0" y="78.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">discard</text><text x="85.0" y="170.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">endosperm half: keep</text><text x="85.0" y="184.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(starch store + aleurone layer)</text><text x="20.0" y="236.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Sterilise, then soak the halves in</text><text x="20.0" y="249.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">gibberellic acid (one concentration</text><text x="20.0" y="263.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">per plate). Place cut face down</text><text x="20.0" y="276.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">on starch agar; incubate 24–48 h.</text><circle cx="335" cy="165" r="80" fill="#26305e" stroke="#1b1f23" stroke-width="1.6"/><ellipse cx="299" cy="131" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><circle cx="371" cy="131" r="3" fill="#efe2b8"/><ellipse cx="371" cy="131" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><ellipse cx="299" cy="199" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><ellipse cx="371" cy="199" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><text x="335.0" y="65.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2. No gibberellin (control)</text><text x="335.0" y="79.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">little or no clear zone</text><circle cx="525" cy="165" r="80" fill="#26305e" stroke="#1b1f23" stroke-width="1.6"/><circle cx="489" cy="131" r="26" fill="#efe2b8"/><ellipse cx="489" cy="131" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><circle cx="561" cy="131" r="29" fill="#efe2b8"/><ellipse cx="561" cy="131" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><circle cx="489" cy="199" r="24" fill="#efe2b8"/><ellipse cx="489" cy="199" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><circle cx="561" cy="199" r="28" fill="#efe2b8"/><ellipse cx="561" cy="199" rx="9" ry="6" fill="#d9b25c" stroke="#7a5a1c" stroke-width="1"/><text x="525.0" y="65.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">3. Soaked in gibberellic acid</text><text x="525.0" y="79.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">large clear zones</text><line x1="533" y1="199" x2="589" y2="199" stroke="#b3261e" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="622.0" y="120.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">After incubation, flood</text><text x="622.0" y="133.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">with iodine solution.</text><text x="622.0" y="147.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Blue-black: starch</text><text x="622.0" y="160.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">still there.</text><text x="622.0" y="174.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Clear zone: starch</text><text x="622.0" y="187.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">digested by amylase.</text><text x="622.0" y="201.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Measure the diameter</text><text x="622.0" y="214.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(red arrow).</text></svg>