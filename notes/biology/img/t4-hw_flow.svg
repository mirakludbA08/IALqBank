<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="20" y="30" width="220" height="70" rx="10" fill="#fdecea" stroke="#1b1f23" stroke-width="1.3"/><text x="130.0" y="60.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">1. Count the recessive</text><text x="130.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">phenotype (aa only)</text><rect x="280" y="30" width="220" height="70" rx="10" fill="#fdecea" stroke="#1b1f23" stroke-width="1.3"/><text x="390.0" y="60.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2. q² = number aa</text><text x="390.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">÷ total in population</text><rect x="540" y="30" width="220" height="70" rx="10" fill="#eef6f1" stroke="#1b1f23" stroke-width="1.3"/><text x="650.0" y="60.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">3. q = √q²</text><text x="650.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(square root!)</text><rect x="20" y="150" width="220" height="70" rx="10" fill="#eef6f1" stroke="#1b1f23" stroke-width="1.3"/><text x="130.0" y="180.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">4. p = 1 − q</text><text x="130.0" y="200.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(from p + q = 1)</text><rect x="280" y="150" width="220" height="70" rx="10" fill="#eef6f1" stroke="#1b1f23" stroke-width="1.3"/><text x="390.0" y="180.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">5. p² = AA,  2pq = Aa,</text><text x="390.0" y="200.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">q² = aa (carriers = 2pq)</text><rect x="540" y="150" width="220" height="70" rx="10" fill="#eef6f1" stroke="#1b1f23" stroke-width="1.3"/><text x="650.0" y="180.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">6. × 100 for a %, or</text><text x="650.0" y="200.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">× population for a number</text><line x1="240.0" y1="65.0" x2="276.0" y2="65.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/><line x1="500.0" y1="65.0" x2="536.0" y2="65.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650,100 L650,125 L130,125 L130,146" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/><line x1="240.0" y1="185.0" x2="276.0" y2="185.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/><line x1="500.0" y1="185.0" x2="536.0" y2="185.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/><text x="390.0" y="248.0" font-size="12" font-weight="600" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">Start from the recessive phenotype: dominant-looking individuals are p² + 2pq mixed together.</text><text x="390.0" y="264.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Check: p² + 2pq + q² = 1. Round only at the end.</text></svg>