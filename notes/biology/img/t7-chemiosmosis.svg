 sans-serif">reduced NAD</text><text x="14.0" y="243.0" font-size="11" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">→ NAD + H⁺ + 2e⁻</text><text x="406.0" y="272.0" font-size="11" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">½O₂ + 2H⁺ + 2e⁻ → H₂O</text><text x="406.0" y="287.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">oxygen = final electron acceptor</text><rect x="638" y="112" width="44" height="86" rx="8" fill="#1f7a4d"/><rect x="654" y="198" width="12" height="22" fill="#1f7a4d"/><ellipse cx="660" cy="240" rx="38" ry="24" fill="#1f7a4d"/><text x="660.0" y="244.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">ATP synthase</text><line x1="660.0" y1="60.0" x2="660.0" y2="106.0" stroke="#b3261e" stroke-width="2.0" marker-end="url(#ahr)"/><text x="652.0" y="56.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">H⁺ diffuse back down</text><text x="652.0" y="70.0" font-size="10" font-weight="500" text-anchor="end" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">the gradient through the channel</text><text x="660.0" y="290.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">ADP + Pi → ATP</text><text x="660.0" y="305.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(chemiosmosis)</text><text x="230.0" y="306.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Energy released as electrons pass along the carriers</text><text x="230.0" y="321.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">is used to pump H⁺ from the