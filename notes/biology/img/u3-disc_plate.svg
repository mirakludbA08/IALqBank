<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300"><circle cx="150" cy="145" r="115" fill="#efe3bf" stroke="#1b1f23" stroke-width="1.6"/><line x1="35" y1="145" x2="265" y2="145" stroke="#5b6470" stroke-width="0.9" stroke-dasharray="4 3"/><line x1="150" y1="30" x2="150" y2="260" stroke="#5b6470" stroke-width="0.9" stroke-dasharray="4 3"/><circle cx="95" cy="90" r="34" fill="#ffffff" stroke="#c9b98a" stroke-width="1"/><circle cx="95" cy="90" r="8" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="95.0" y="94.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">G</text><circle cx="205" cy="90" r="24" fill="#ffffff" stroke="#c9b98a" stroke-width="1"/><circle cx="205" cy="90" r="8" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="205.0" y="94.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">M</text><circle cx="95" cy="200" r="8" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="95.0" y="204.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">C</text><circle cx="205" cy="200" r="8" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="205.0" y="204.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">C</text><line x1="61" y1="90" x2="129" y2="90" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="3 2"/><line x1="95" y1="56" x2="95" y2="124" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="3 2"/><rect x="32.9" y="89.7" width="18" height="32" fill="#f6d55c" opacity="0.85" transform="rotate(290 41.9 105.7)"/><rect x="249.1" y="89.7" width="18" height="32" fill="#f6d55c" opacity="0.85" transform="rotate(430 258.1 105.7)"/><text x="300.0" y="40.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">G = garlic extract disc, M = mint extract disc</text><text x="300.0" y="58.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">C = control discs: soaked in the solvent (ethanol)</text><text x="300.0" y="76.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">only, then dried, same size as the others</text><text x="300.0" y="106.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">clear zone = zone of inhibition: the extract has</text><text x="300.0" y="124.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">diffused into the agar and stopped bacterial growth</text><text x="300.0" y="154.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">measure two diameters at right angles (red dashes),</text><text x="300.0" y="172.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">take the mean d; area = π(d ÷ 2)²</text><text x="300.0" y="202.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">lid held by two strips of tape, not sealed all</text><text x="300.0" y="220.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">round (keeps it aerobic); plate stored upside down;</text><text x="300.0" y="238.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">incubated at 25 °C (below 30 °C), never reopened</text></svg>