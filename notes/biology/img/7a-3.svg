<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d2330">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1d2330"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- phase dividers -->
<g stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5">
<line x1="200" y1="56" x2="200" y2="352"/>
<line x1="440" y1="56" x2="440" y2="352"/>
</g>
<g text-anchor="middle" font-weight="600" fill="#002b80">
<text x="145" y="44">Before</text>
<text x="320" y="44">During</text>
<text x="565" y="44">After</text>
</g>

<!-- oxygen deficit: gap between demand and uptake as exercise begins -->
<path d="M200,130 H298 C262,134 222,176 200,320 Z" fill="#fff4e6"/>
<!-- excess post-exercise oxygen consumption -->
<path d="M440,130 C455,236 500,310 590,318 L440,320 Z" fill="#e7f0ff"/>

<!-- oxygen demand during exercise -->
<line x1="200" y1="130" x2="440" y2="130" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- axes -->
<g stroke="#1d2330" stroke-width="2" fill="none">
<line x1="100" y1="352" x2="100" y2="60" marker-end="url(#ar)"/>
<line x1="100" y1="352" x2="692" y2="352" marker-end="url(#ar)"/>
</g>
<text transform="translate(40,206) rotate(-90)" text-anchor="middle">Oxygen consumption</text>
<text x="396" y="392" text-anchor="middle">Time</text>

<!-- oxygen consumption curve -->
<path d="M100,320 H200 C222,176 262,134 298,130 H440 C455,236 500,310 590,318 H684" fill="none" stroke="#002b80" stroke-width="3.5" stroke-linejoin="round"/>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.5">
<line x1="140" y1="100" x2="209" y2="160"/>
<line x1="372" y1="102" x2="372" y2="124"/>
<line x1="556" y1="170" x2="481" y2="290"/>
</g>
<g fill="#495057"><circle cx="209" cy="160" r="2.5"/><circle cx="372" cy="124" r="2.5"/><circle cx="481" cy="290" r="2.5"/></g>
<text x="108" y="94">Oxygen deficit</text>
<text x="372" y="94" text-anchor="middle">Steady state</text>
<text x="486" y="126" font-weight="600" fill="#002b80">EPOC</text>
<text x="486" y="146" font-size="14">excess post-exercise</text>
<text x="486" y="164" font-size="14">oxygen consumption</text>
</svg>
