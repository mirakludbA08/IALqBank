<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(30 0)">
    <!-- adenine: six-membered ring fused to a five-membered ring -->
    <polygon points="100,112 132.9,131 132.9,169 100,188 67.1,169 67.1,131" fill="#e7f0ff" stroke="#002b80" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="132.9,131 132.9,169 169,180.7 191.3,150 169,119.3" fill="#e7f0ff" stroke="#002b80" stroke-width="2" stroke-linejoin="round"/>

    <!-- link from adenine to ribose -->
    <line x1="169" y1="180.7" x2="219.6" y2="185.1" stroke="#002b80" stroke-width="2"/>

    <!-- ribose ring -->
    <polygon points="250,163 280.4,185.1 268.8,220.9 231.2,220.9 219.6,185.1" fill="#fff4e6" stroke="#002b80" stroke-width="2" stroke-linejoin="round"/>

    <!-- link from ribose to the phosphate chain, and bonds between phosphates -->
    <line x1="280.4" y1="185.1" x2="348" y2="185" stroke="#002b80" stroke-width="2"/>
    <line x1="392" y1="185" x2="448" y2="185" stroke="#495057" stroke-width="3"/>
    <line x1="492" y1="185" x2="548" y2="185" stroke="#e03131" stroke-width="5"/>

    <!-- three phosphate groups -->
    <circle cx="370" cy="185" r="22" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
    <circle cx="470" cy="185" r="22" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
    <circle cx="570" cy="185" r="22" fill="#fdecec" stroke="#e03131" stroke-width="2"/>
    <g font-size="18" font-weight="bold" text-anchor="middle">
      <text x="370" y="191">P</text>
      <text x="470" y="191">P</text>
      <text x="570" y="191">P</text>
    </g>

    <!-- labels with leader lines -->
    <g stroke="#495057" stroke-width="1.5" fill="none">
      <line x1="100" y1="82" x2="100" y2="110"/>
      <line x1="250" y1="82" x2="250" y2="161"/>
      <path d="M348 222 V232 H592 V222"/>
    </g>
    <line x1="520" y1="96" x2="520" y2="177" stroke="#e03131" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="100" y="72">adenine (base)</text>
      <text x="250" y="72">ribose (sugar)</text>
      <text x="470" y="258">three phosphate groups</text>
      <text x="520" y="62" font-weight="bold">bond to the last phosphate</text>
      <text x="520" y="82" font-weight="bold">is hydrolysed: energy released</text>
    </g>
  </g>
</svg>
