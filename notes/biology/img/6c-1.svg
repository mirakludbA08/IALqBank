<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- guide lines at the three temperatures -->
  <g stroke="#ced4da" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="90" y1="80" x2="690" y2="80"/>
    <line x1="90" y1="172" x2="690" y2="172"/>
    <line x1="90" y1="260" x2="690" y2="260"/>
  </g>

  <!-- axes -->
  <g stroke="#495057" stroke-width="2" fill="none">
    <line x1="90" y1="310" x2="90" y2="26" marker-end="url(#ax)"/>
    <line x1="90" y1="310" x2="704" y2="310" marker-end="url(#ax)"/>
  </g>
  <g stroke="#495057" stroke-width="1.5">
    <line x1="84" y1="80" x2="90" y2="80"/>
    <line x1="84" y1="172" x2="90" y2="172"/>
    <line x1="84" y1="260" x2="90" y2="260"/>
  </g>
  <g text-anchor="end">
    <text x="78" y="85">95</text>
    <text x="78" y="177">72</text>
    <text x="78" y="265">50</text>
  </g>
  <text x="30" y="168" text-anchor="middle" transform="rotate(-90 30 168)">Temperature (°C)</text>
  <text x="397" y="350" text-anchor="middle">Time</text>

  <!-- temperature profile of one cycle -->
  <path d="M90 172 H120 L160 80 H290 L340 260 H470 L510 172 H660" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="160" y1="80" x2="290" y2="80" stroke="#e03131" stroke-width="5"/>
  <line x1="340" y1="260" x2="470" y2="260" stroke="#007bff" stroke-width="5"/>
  <line x1="510" y1="172" x2="660" y2="172" stroke="#f08c00" stroke-width="5"/>

  <!-- stage labels -->
  <g text-anchor="middle">
    <text x="225" y="50" font-weight="bold" fill="#002b80">Denaturation</text>
    <text x="225" y="68">DNA strands separate</text>
    <text x="405" y="222" font-weight="bold" fill="#002b80">Annealing</text>
    <text x="405" y="240">primers bind</text>
    <text x="585" y="134" font-weight="bold" fill="#002b80">Extension</text>
    <text x="585" y="152">primers extended</text>
  </g>
</svg>
