<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007bff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0,-30)">

<!-- base of the dish -->
<path d="M170 170 V250 A190 42 0 0 0 550 250 V170 Z" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>

<!-- agar -->
<path d="M174 232 V246 A186 40 0 0 0 546 246 V232 A186 40 0 0 1 174 232 Z" fill="#fff4e6" stroke="#f08c00" stroke-width="1.4"/>
<ellipse cx="360" cy="232" rx="186" ry="40" fill="#fff4e6" stroke="#f08c00" stroke-width="1.4"/>

<!-- lid -->
<path d="M160 120 V170 A200 44 0 0 0 560 170 V120 A200 44 0 0 1 160 120 Z" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<ellipse cx="360" cy="120" rx="200" ry="44" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<ellipse cx="360" cy="120" rx="186" ry="38" fill="none" stroke="#adb5bd" stroke-width="1.2"/>

<!-- two short strips of tape -->
<g fill="#ffe3bf" stroke="#f08c00" stroke-width="1.6" stroke-linejoin="round">
<polygon points="214,138 240,143 240,235 214,230"/>
<polygon points="506,138 480,143 480,235 506,230"/>
</g>

<!-- air entering -->
<line x1="634" y1="208" x2="560" y2="178" stroke="#007bff" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="704" y="232" text-anchor="end" fill="#002b80">air can still get in</text>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.2" fill="#495057">
<line x1="44" y1="121" x2="190" y2="121"/><circle cx="190" cy="121" r="2.5" stroke="none"/>
<line x1="52" y1="186" x2="222" y2="186"/><circle cx="222" cy="186" r="2.5" stroke="none"/>
<line x1="56" y1="238" x2="170" y2="238"/><circle cx="170" cy="238" r="2.5" stroke="none"/>
<line x1="666" y1="150" x2="500" y2="150"/><circle cx="500" cy="150" r="2.5" stroke="none"/>
<line x1="666" y1="264" x2="504" y2="264"/><circle cx="504" cy="264" r="2.5" stroke="none"/>
</g>
<text x="16" y="126">lid</text>
<text x="16" y="191">tape</text>
<text x="16" y="243">base</text>
<text x="704" y="155" text-anchor="end">tape</text>
<text x="704" y="269" text-anchor="end">agar</text>
</g>
</svg>
