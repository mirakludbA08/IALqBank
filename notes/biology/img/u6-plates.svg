<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290"><circle cx="150" cy="130" r="105" fill="#efe3bf" stroke="#1b1f23" stroke-width="1.6"/><circle cx="105" cy="90" r="30" fill="#ffffff" stroke="#c9b98a" stroke-width="1"/><circle cx="105" cy="90" r="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="105.0" y="94.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">A</text><circle cx="195" cy="90" r="18" fill="#ffffff" stroke="#c9b98a" stroke-width="1"/><circle cx="195" cy="90" r="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="195.0" y="94.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">B</text><circle cx="105" cy="175" r="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="105.0" y="179.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif"></text><circle cx="195" cy="175" r="24" fill="#ffffff" stroke="#c9b98a" stroke-width="1"/><circle cx="195" cy="175" r="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/><text x="195.0" y="179.0" font-size="9" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">C</text><text x="105.0" y="197.0" font-size="9.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">control disc</text><text x="105.0" y="209.0" font-size="9.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(no zone)</text><line x1="75" y1="90" x2="135" y2="90" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="3 2"/><line x1="105" y1="60" x2="105" y2="120" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="3 2"/><text x="150.0" y="258.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Bacterial lawn + antibiotic discs</text><text x="150.0" y="274.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">clear zone = zone of inhibition (no bacterial growth)</text><text x="150.0" y="287.0" font-size="10" font-weight="500" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">measure two diameters at right angles; take the mean</text><circle cx="490" cy="130" r="105" fill="#262b57" stroke="#1b1f23" stroke-width="1.6"/><ellipse cx="450" cy="92" rx="38" ry="30" fill="#e9edf7"/><ellipse cx="450" cy="92" rx="11" ry="6" fill="#d9b77a" stroke="#8a6d3b" stroke-width="0.8"/><ellipse cx="532" cy="100" rx="30" ry="22" fill="#e9edf7"/><ellipse cx="532" cy="100" rx="11" ry="6" fill="#d9b77a" stroke="#8a6d3b" stroke-width="0.8"/><ellipse cx="460" cy="178" rx="22" ry="14" fill="#e9edf7"/><ellipse cx="460" cy="178" rx="11" ry="6" fill="#d9b77a" stroke="#8a6d3b" stroke-width="0.8"/><ellipse cx="535" cy="180" rx="11" ry="6" fill="#d9b77a" stroke="#8a6d3b" stroke-width="0.8"/><text x="535.0" y="202.0" font-size="9.5" font-weight="500" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">boiled / no GA</text><text x="490.0" y="258.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Starch agar flooded with iodine</text><text x="490.0" y="274.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">clear zone = starch digested by amylase from the grain</text><text x="490.0" y="287.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">blue-black = starch still present (not a zone of inhibition)</text></svg>