chor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">dependent reactions)</text><path d="M 326,318 C 220,330 110,310 100,219" fill="none" stroke="#1f7a4d" stroke-width="2.4" marker-end="url(#ag)"/><text x="214.0" y="296.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">3  Regeneration of RuBP</text><text x="214.0" y="352.0" font-size="11" font-weight="600" text-anchor="middle" fill="#c77700" font-family="Segoe UI, Arial, sans-serif">5 of every 6 GALP; uses ATP</text><line x1="452.0" y1="315.0" x2="500.0" y2="315.0" stroke="#1b1f23" stroke-width="2" marker-end="url(#ak)"/><text x="506.0" y="300.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">1 in 6 GALP</text><text x="506.0" y="316.0" font-size="11" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">leaves the cycle →</text><text x="506.0" y="332.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">glucose, sucrose, starch,</text><text x="506.0" y="346.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">cellulose, lipids, amino</text><text x="506.0" y="360.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">acids, nucleic acids</text><text x="206.0" y="214.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a4d" font-family="Segoe UI, Arial, sans-serif">Calvin cycle</text><text x="206.0" y="232.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">in the stroma</text></svg>