<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330"><rect x="40" y="300" width="160" height="12" fill="#5b6470"/><rect x="64" y="20" width="8" height="282" fill="#8a929b"/><rect x="64" y="40" width="110" height="8" fill="#8a929b"/><rect x="166" y="34" width="22" height="20" rx="3" fill="#5b6470"/><line x1="177" y1="54" x2="177" y2="190" stroke="#1f7a4d" stroke-width="2.4"/><line x1="177" y1="190" x2="177" y2="205" stroke="#1b1f23" stroke-width="1.6"/><rect x="157" y="205" width="40" height="10" rx="2" fill="#b8bec5" stroke="#1b1f23" stroke-width="0.8"/><rect x="157" y="216" width="40" height="10" rx="2" fill="#b8bec5" stroke="#1b1f23" stroke-width="0.8"/><rect x="157" y="227" width="40" height="10" rx="2" fill="#b8bec5" stroke="#1b1f23" stroke-width="0.8"/><rect x="157" y="238" width="40" height="10" rx="2" fill="#b8bec5" stroke="#1b1f23" stroke-width="0.8"/><rect x="130" y="276" width="94" height="24" fill="#f3e6c8" stroke="#1b1f23" stroke-width="1"/><path d="M136,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><path d="M151,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><path d="M166,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><path d="M181,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><path d="M196,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><path d="M211,288 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#c4a76a" stroke-width="1"/><line x1="188" y1="44" x2="246" y2="40" stroke="#5b6470" stroke-width="0.8"/><text x="250.0" y="44.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">clamp holds the top of the fibre firmly</text><line x1="179" y1="120" x2="246" y2="100" stroke="#5b6470" stroke-width="0.8"/><text x="250.0" y="104.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">fibre: known length (e.g. 10 cm between clamp</text><text x="250.0" y="119.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">and hanger) and measured diameter</text><line x1="197" y1="222" x2="246" y2="176" stroke="#5b6470" stroke-width="0.8"/><text x="250.0" y="180.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">mass hanger: add 10 g masses one at a time,</text><text x="250.0" y="195.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">gently, until the fibre breaks</text><line x1="224" y1="288" x2="246" y2="258" stroke="#5b6470" stroke-width="0.8"/><text x="250.0" y="262.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">tray with foam or sand: catches falling masses</text><text x="250.0" y="300.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">eye protection: a snapping fibre can whip up</text></svg>