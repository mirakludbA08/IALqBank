<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="85" width="170" height="70" rx="12" fill="#fbe3e1" stroke="#b3261e" stroke-width="2"/><text x="125.0" y="117.0" font-size="22" font-weight="700" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">P<tspan font-size="11" dy="4">R</tspan></text><text x="125.0" y="141.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">absorbs red light (660 nm)</text><rect x="340" y="85" width="170" height="70" rx="12" fill="#f1e4f2" stroke="#7a2e7f" stroke-width="2"/><text x="425.0" y="117.0" font-size="22" font-weight="700" text-anchor="middle" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">P<tspan font-size="11" dy="4">FR</tspan></text><text x="425.0" y="141.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">absorbs far-red light (730 nm)</text><path d="M200,81 Q275.0,15 350,79" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#ah)"/><text x="275.0" y="35.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">red light (660 nm): fast</text><text x="275.0" y="49.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">daylight has more red than far red</text><path d="M350,159 Q275.0,215 200,161" fill="none" stroke="#7a2e7f" stroke-width="2.4" marker-end="url(#ah)"/><text x="275.0" y="215.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">far-red light (730 nm): fast</text><path d="M380,159 Q275.0,355 170,161" fill="none" stroke="#5b6470" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="275.0" y="279.0" font-size="11" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">darkness: slow conversion back</text><text x="40.0" y="179.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">Inactive form.</text><text x="40.0" y="192.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">Builds up during</text><text x="40.0" y="206.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">a long night.</text><text x="532.0" y="55.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">Active form. Moves into the</text><text x="532.0" y="68.5" font-size="10.5" font-weight="600" text-anchor="start" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">nucleus and switches genes</text><text x="532.0" y="82.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">on or off (via transcription</text><text x="532.0" y="95.5" font-size="10.5" font-weight="600" text-anchor="start" fill="#7a2e7f" font-family="Segoe UI, Arial, sans-serif">factors). Effects include:</text><text x="532.0" y="125.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">•</text><text x="542.0" y="125.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">seeds germinate (e.g. lettuce)</text><text x="532.0" y="143.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">•</text><text x="542.0" y="143.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">leaves open, chlorophyll made</text><text x="532.0" y="161.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">•</text><text x="542.0" y="161.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">inhibits flowering in</text><text x="542.0" y="175.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">short-day plants</text><text x="532.0" y="193.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">•</text><text x="542.0" y="193.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">promotes flowering in</text><text x="542.0" y="207.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">long-day plants</text></svg>