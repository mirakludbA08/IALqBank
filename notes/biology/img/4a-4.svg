<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- two sieve tube elements joined end to end -->
  <g fill="#e7f0ff" stroke="#495057" stroke-width="2.5">
    <path d="M250 226 V70 Q250 64 256 64 H364 Q370 64 370 70 V226 Z"/>
    <path d="M250 238 V394 Q250 400 256 400 H364 Q370 400 370 394 V238 Z"/>
  </g>

  <!-- sieve plate: shared end walls with pores -->
  <rect x="250" y="226" width="120" height="12" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <g fill="#e7f0ff">
    <rect x="258" y="225" width="8" height="14"/>
    <rect x="282" y="225" width="8" height="14"/>
    <rect x="306" y="225" width="8" height="14"/>
    <rect x="330" y="225" width="8" height="14"/>
    <rect x="354" y="225" width="8" height="14"/>
  </g>

  <!-- companion cell, with the wall it shares with the sieve tube element -->
  <rect x="370" y="90" width="12" height="130" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <rect x="382" y="90" width="118" height="130" rx="5" fill="#fff4e6" stroke="#495057" stroke-width="2.5"/>

  <!-- plasmodesmata through the shared wall -->
  <g fill="#ffffff" stroke="#495057" stroke-width="1.2">
    <rect x="365" y="109" width="22" height="6"/>
    <rect x="365" y="152" width="22" height="6"/>
    <rect x="365" y="195" width="22" height="6"/>
  </g>

  <!-- nucleus and mitochondria of the companion cell -->
  <circle cx="441" cy="150" r="21" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <g fill="#eaf7ee" stroke="#2f9e44" stroke-width="1.5">
    <ellipse cx="412" cy="114" rx="9" ry="5" transform="rotate(-20 412 114)"/>
    <ellipse cx="478" cy="118" rx="9" ry="5" transform="rotate(30 478 118)"/>
    <ellipse cx="412" cy="186" rx="9" ry="5" transform="rotate(10 412 186)"/>
    <ellipse cx="456" cy="201" rx="9" ry="5" transform="rotate(-15 456 201)"/>
    <ellipse cx="482" cy="168" rx="9" ry="5" transform="rotate(60 482 168)"/>
  </g>

  <!-- leader lines -->
  <g stroke="#495057" stroke-width="1.2" fill="none">
    <path d="M238 146 L262 150"/>
    <path d="M238 232 L256 232"/>
    <path d="M238 326 L262 330"/>
    <path d="M516 104 L494 112"/>
    <path d="M516 146 L458 150"/>
    <path d="M516 186 L488 171"/>
    <path d="M376 58 V112"/>
  </g>
  <g fill="#495057">
    <circle cx="262" cy="150" r="2.5"/>
    <circle cx="256" cy="232" r="2.5"/>
    <circle cx="262" cy="330" r="2.5"/>
    <circle cx="494" cy="112" r="2.5"/>
    <circle cx="458" cy="150" r="2.5"/>
    <circle cx="488" cy="171" r="2.5"/>
    <circle cx="376" cy="112" r="2.5"/>
  </g>

  <!-- labels -->
  <g text-anchor="end">
    <text x="232" y="151">sieve tube element</text>
    <text x="232" y="237">sieve plate</text>
    <text x="232" y="331">sieve tube element</text>
  </g>
  <g text-anchor="start">
    <text x="522" y="109">companion cell</text>
    <text x="522" y="151">nucleus</text>
    <text x="522" y="191">mitochondria</text>
  </g>
  <text x="376" y="46" text-anchor="middle">plasmodesmata</text>
</svg>
