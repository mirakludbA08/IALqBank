<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360"><line x1="70" y1="271.4" x2="430" y2="271.4" stroke="#e3e7eb"/><text x="64" y="275.4" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">-80</text><line x1="70" y1="234.3" x2="430" y2="234.3" stroke="#e3e7eb"/><text x="64" y="238.3" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">-60</text><line x1="70" y1="197.1" x2="430" y2="197.1" stroke="#e3e7eb"/><text x="64" y="201.1" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">-40</text><line x1="70" y1="160.0" x2="430" y2="160.0" stroke="#e3e7eb"/><text x="64" y="164.0" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">-20</text><line x1="70" y1="122.9" x2="430" y2="122.9" stroke="#e3e7eb"/><text x="64" y="126.9" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">0</text><line x1="70" y1="85.7" x2="430" y2="85.7" stroke="#e3e7eb"/><text x="64" y="89.7" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">20</text><line x1="70" y1="48.6" x2="430" y2="48.6" stroke="#e3e7eb"/><text x="64" y="52.6" font-size="11" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">40</text><text x="70.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">0</text><text x="142.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">1</text><text x="214.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">2</text><text x="286.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">3</text><text x="358.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">4</text><text x="430.0" y="306" font-size="11" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">5</text><line x1="70" y1="290" x2="430" y2="290" stroke="#1b1f23" stroke-width="1.4"/><line x1="70" y1="290" x2="70" y2="30" stroke="#1b1f23" stroke-width="1.4"/><text x="250.0" y="324" font-size="12" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Time / ms</text><text transform="translate(28,160.0) rotate(-90)" font-size="12" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Membrane potential / mV</text><line x1="70" y1="252.9" x2="430" y2="252.9" stroke="#5b6470" stroke-width="1" stroke-dasharray="4 3"/><line x1="70" y1="225.0" x2="430" y2="225.0" stroke="#b3261e" stroke-width="1" stroke-dasharray="4 3"/><text x="300.4" y="220.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">threshold (about −55 mV)</text><text x="73.6" y="267.9" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">resting (−70 mV)</text><line x1="70" y1="122.9" x2="430" y2="122.9" stroke="#5b6470" stroke-width="0.8"/><path d="M70.0,252.9 C79.6,252.9 115.0,253.8 127.6,252.9 C140.2,251.9 140.2,250.4 145.6,247.3 C151.0,244.2 156.0,238.0 160.0,234.3 C164.0,230.6 166.4,234.3 169.4,225.0 C172.4,215.7 175.1,197.1 178.0,178.6 C180.9,160.0 183.8,133.1 186.6,113.6 C189.5,94.1 192.5,72.4 195.3,61.6 C198.0,50.7 200.4,48.3 203.2,48.6 C206.0,48.9 208.2,52.6 211.8,63.4 C215.4,74.3 220.2,94.4 224.8,113.6 C229.4,132.8 234.4,158.5 239.2,178.6 C244.0,198.7 248.8,220.0 253.6,234.3 C258.4,248.5 263.2,257.8 268.0,264.0 C272.8,270.2 275.8,271.1 282.4,271.4 C289.0,271.7 297.4,268.5 307.6,265.9 C317.8,263.2 331.6,257.8 343.6,255.6 C355.6,253.5 365.2,253.3 379.6,252.9 C394.0,252.4 421.6,252.9 430.0,252.9" fill="none" stroke="#1f7a4d" stroke-width="2.8"/><circle cx="98.8" cy="238.9" r="8.5" fill="#1d6fb8"/><text x="98.8" y="242.9" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">1</text><circle cx="153.4" cy="225.0" r="8.5" fill="#1d6fb8"/><text x="153.4" y="229.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">2</text><circle cx="170.6" cy="113.6" r="8.5" fill="#1d6fb8"/><text x="170.6" y="117.6" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">3</text><circle cx="203.2" cy="34.6" r="8.5" fill="#1d6fb8"/><text x="203.2" y="38.6" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">4</text><circle cx="251.6" cy="160.0" r="8.5" fill="#1d6fb8"/><text x="251.6" y="164.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">5</text><circle cx="282.4" cy="285.4" r="8.5" fill="#1d6fb8"/><text x="282.4" y="289.4" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">6</text><circle cx="365.2" cy="266.9" r="8.5" fill="#1d6fb8"/><text x="365.2" y="270.9" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">7</text><path d="M174.4,30 L174.4,22 L343.6,22 L343.6,30" fill="none" stroke="#b7791f" stroke-width="1.3"/><text x="259.0" y="17.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b7791f" font-family="Segoe UI, Arial, sans-serif">refractory period: no new action potential can start</text><circle cx="463.0" cy="36.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="40.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">1</text><text x="477.0" y="40.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Resting: Na⁺/K⁺ pump has set up gradients;</text><text x="477.0" y="53.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">membrane more permeable to K⁺ (leaks out)</text><circle cx="463.0" cy="73.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="77.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">2</text><text x="477.0" y="77.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Stimulus: a few Na⁺ channels open;</text><text x="477.0" y="90.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">potential rises to threshold</text><circle cx="463.0" cy="110.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="114.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">3</text><text x="477.0" y="114.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Depolarisation: voltage-gated Na⁺ channels</text><text x="477.0" y="127.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">open, Na⁺ diffuses in (more open: + feedback)</text><circle cx="463.0" cy="147.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="151.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">4</text><text x="477.0" y="151.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Peak (about +40 mV): Na⁺ channels close,</text><text x="477.0" y="164.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">voltage-gated K⁺ channels open</text><circle cx="463.0" cy="184.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="188.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">5</text><text x="477.0" y="188.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Repolarisation: K⁺ diffuses out,</text><text x="477.0" y="201.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">inside becomes negative again</text><circle cx="463.0" cy="221.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="225.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">6</text><text x="477.0" y="225.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Hyperpolarisation: K⁺ channels slow to</text><text x="477.0" y="238.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">close, so too much K⁺ leaves (about −80 mV)</text><circle cx="463.0" cy="258.0" r="8.5" fill="#1d6fb8"/><text x="463.0" y="262.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">7</text><text x="477.0" y="262.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Resting potential restored as K⁺ channels</text><text x="477.0" y="275.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">close and the pump keeps working</text></svg>