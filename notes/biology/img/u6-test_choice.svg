<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="200" y="10" width="300" height="44" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/><text x="350.0" y="36.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">What does the question want to find out?</text><line x1="350" y1="54" x2="115" y2="82" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="10" y="86" width="210" height="58" rx="7" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.2"/><text x="115.0" y="104.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">A difference</text><text x="115.0" y="119.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">between two groups</text><text x="115.0" y="134.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(two sets of measurements)</text><line x1="350" y1="54" x2="350" y2="82" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="245" y="86" width="210" height="58" rx="7" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.2"/><text x="350.0" y="104.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">A correlation</text><text x="350.0" y="119.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">between two measured</text><text x="350.0" y="134.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">variables (paired data)</text><line x1="350" y1="54" x2="585" y2="82" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="480" y="86" width="210" height="58" rx="7" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.2"/><text x="585.0" y="104.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Observed v expected</text><text x="585.0" y="119.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">counts (frequencies)</text><text x="585.0" y="134.0" font-size="11" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">in categories</text><line x1="70" y1="144" x2="62" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><line x1="150" y1="144" x2="170" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="4" y="180" width="112" height="74" rx="7" fill="#ffffff" stroke="#1d6fb8" stroke-width="1.2"/><text x="60.0" y="198.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">t test</text><text x="60.0" y="213.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">means; continuous,</text><text x="60.0" y="228.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">roughly normal</text><text x="60.0" y="243.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">data</text><rect x="122" y="180" width="112" height="74" rx="7" fill="#ffffff" stroke="#1d6fb8" stroke-width="1.2"/><text x="178.0" y="198.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Mann-Whitney U</text><text x="178.0" y="213.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">medians; ranked,</text><text x="178.0" y="228.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">skewed or small</text><text x="178.0" y="243.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">samples</text><line x1="350" y1="144" x2="350" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="270" y="180" width="160" height="74" rx="7" fill="#ffffff" stroke="#1d6fb8" stroke-width="1.2"/><text x="350.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Spearman's rank</text><text x="350.0" y="221.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">rₛ; at least 5 pairs,</text><text x="350.0" y="236.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">ideally 7 to 30</text><line x1="585" y1="144" x2="585" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/><rect x="505" y="180" width="160" height="74" rx="7" fill="#ffffff" stroke="#1d6fb8" stroke-width="1.2"/><text x="585.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Chi-squared (χ²)</text><text x="585.0" y="221.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">raw counts only,</text><text x="585.0" y="236.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">never %, means or lengths</text><text x="120.0" y="278.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Graph: bar graph of means (or medians)</text><text x="120.0" y="293.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">with range bars or ± SD</text><text x="350.0" y="278.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Graph: scatter graph</text><text x="350.0" y="293.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(line of best fit optional)</text><text x="585.0" y="278.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Graph: bar chart of the counts</text><text x="585.0" y="293.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">in each category</text><text x="350.0" y="322.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Null hypothesis: "no (significant) difference / correlation / preference", in the words of the context</text></svg>