4" fill="#e9c82b" stroke="#3a3f46" stroke-width="1"/><text x="70.0" y="20.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">1</text><text x="112.0" y="20.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2</text><text x="154.0" y="20.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">3</text><text x="196.0" y="20.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">4</text><text x="290.0" y="40.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Key (this question's colours)</text><circle cx="300" cy="66" r="9" fill="#2fa64f" stroke="#3a3f46"/><text x="316.0" y="70.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">green: cDNA from healthy cells only (gene active only there)</text><circle cx="300" cy="96" r="9" fill="#d33a3a" stroke="#3a3f46"/><text x="316.0" y="100.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">red: cDNA from tumour cells only (gene active only there)</text><circle cx="300" cy="126" r="9" fill="#e9c82b" stroke="#3a3f46"/><text x="316.0" y="130.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">yellow: both bound (gene active in both)</text><circle cx="300" cy="156" r="9" fill="#202226" stroke="#3a3f46"/><text x="316.0" y="160.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">black: neither bound (gene not transcribed)</text><text x="290.0" y="200.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Each spot holds many copies of one known single-stranded</text><text x="290.0" y="213.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">DNA probe. Brightness shows how much cDNA bound,</text><text x="290.0" y="227.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">so how strongly that gene was being expressed.</text></svg>