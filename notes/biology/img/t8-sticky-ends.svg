iddle" fill="#b7791f" font-family="Segoe UI, Arial, sans-serif">sticky end 3′-TTAA-5′</text><text x="324.0" y="145.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b7791f" font-family="Segoe UI, Arial, sans-serif">sticky end 5′-AATT-3′</text><text x="500.0" y="160.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Cut the plasmid AND the gene with the</text><text x="500.0" y="173.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">SAME restriction enzyme, so their</text><text x="500.0" y="187.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">sticky ends are complementary.</text><text x="20.0" y="246.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">3. Plasmid end + gene end: the sticky ends base-pair, then DNA ligase seals the backbone</text><text x="96.0" y="282.0" font-size="10.5" font-weight="600" text-anchor="end" fill="#1f7a4d" font-family="Segoe UI, Arial, sans-serif">plasmid</text><text x="300.0" y="282.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">gene</text><text x="110.0" y="282" font-size="15" font-weight="500" text-anchor="middle" fill="#1f7a4d" font-family="Consolas, Courier New, monospace">T</text><text x="126.0" y="282" font-size="15" font-weight="500" text-anchor="middle" fill="#1f7a4d" font-family="Consolas, Courier New, monospace">A</text><text x="142.0" y="282" font-size="15" font-weight="500" text-anchor="middle" fill="#1f7a4d" font-family="Consolas, Courier New, monospace">C</text><text x="158.0" y="282" font-size="15" font-weight="500" text-anchor="middle" fill="#1f7a4d" font-family="Consolas, Courier New, monospace">G</text><text x="174.0" y="282" font-size="15" font-weight="500" text-anchor="middle" fill="