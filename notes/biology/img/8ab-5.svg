<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d2330">
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- dendrites -->
<g fill="none" stroke="#002b80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M96,146 L62,106 L58,76"/><path d="M62,106 L34,96"/>
<path d="M82,172 L34,172"/><path d="M34,172 L22,158"/><path d="M34,172 L22,186"/>
<path d="M96,200 L62,240 L58,270"/><path d="M62,240 L34,250"/>
</g>

<!-- cell body and nucleus -->
<ellipse cx="136" cy="172" rx="50" ry="46" fill="#e7f0ff" stroke="#002b80" stroke-width="2.5"/>
<circle cx="136" cy="172" r="19" fill="#f3f0ff" stroke="#495057" stroke-width="2"/>

<!-- myelin sheath: one Schwann cell per segment, nodes of Ranvier between -->
<g fill="#fff4e6" stroke="#495057" stroke-width="2">
<rect x="204" y="152" width="88" height="40" rx="10"/>
<rect x="304" y="152" width="88" height="40" rx="10"/>
<rect x="404" y="152" width="88" height="40" rx="10"/>
<rect x="504" y="152" width="88" height="40" rx="10"/>
</g>
<line x1="184" y1="172" x2="636" y2="172" stroke="#002b80" stroke-width="5" stroke-linecap="round"/>

<!-- nerve endings -->
<g fill="none" stroke="#002b80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M636,172 L664,150 L682,128"/>
<path d="M636,172 L686,172"/>
<path d="M636,172 L664,194 L682,216"/>
</g>
<g fill="#e7f0ff" stroke="#002b80" stroke-width="2.5">
<circle cx="688" cy="122" r="7"/><circle cx="694" cy="172" r="7"/><circle cx="688" cy="222" r="7"/>
</g>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.5" fill="none">
<line x1="50" y1="56" x2="58" y2="84"/>
<line x1="136" y1="84" x2="136" y2="156"/>
<line x1="160" y1="262" x2="152" y2="216"/>
<line x1="298" y1="98" x2="298" y2="168"/>
<line x1="470" y1="98" x2="450" y2="152"/>
<path d="M304,206 V214 H392 V206"/>
<line x1="348" y1="214" x2="348" y2="228"/>
<line x1="614" y1="244" x2="614" y2="177"/>
<line x1="636" y1="92" x2="675" y2="136"/>
</g>
<g fill="#495057"><circle cx="58" cy="84" r="2.5"/><circle cx="136" cy="156" r="2.5"/><circle cx="152" cy="216" r="2.5"/><circle cx="298" cy="168" r="2.5"/><circle cx="450" cy="152" r="2.5"/><circle cx="614" cy="177" r="2.5"/><circle cx="675" cy="136" r="2.5"/></g>

<text x="18" y="46">Dendrites</text>
<text x="136" y="74" text-anchor="middle">Nucleus</text>
<text x="164" y="284" text-anchor="middle">Cell body</text>
<text x="298" y="86" text-anchor="middle">Node of Ranvier</text>
<text x="476" y="86" text-anchor="middle">Myelin sheath</text>
<text x="348" y="248" text-anchor="middle">Schwann cell</text>
<text x="614" y="264" text-anchor="middle">Axon</text>
<text x="702" y="82" text-anchor="end">Nerve endings</text>
</svg>
