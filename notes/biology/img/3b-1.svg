<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d2330">
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- zone of maturation: large cells -->
<rect x="240" y="30" width="120" height="170" fill="#eaf7ee"/>
<g stroke="#adb5bd" stroke-width="1">
<line x1="270" y1="30" x2="270" y2="200"/><line x1="300" y1="30" x2="300" y2="200"/><line x1="330" y1="30" x2="330" y2="200"/>
<line x1="240" y1="72.5" x2="360" y2="72.5"/><line x1="240" y1="115" x2="360" y2="115"/><line x1="240" y1="157.5" x2="360" y2="157.5"/>
</g>

<!-- zone of elongation: medium cells -->
<rect x="240" y="200" width="120" height="90" fill="#e7f0ff"/>
<g stroke="#adb5bd" stroke-width="1">
<line x1="270" y1="200" x2="270" y2="290"/><line x1="300" y1="200" x2="300" y2="290"/><line x1="330" y1="200" x2="330" y2="290"/>
<line x1="240" y1="230" x2="360" y2="230"/><line x1="240" y1="260" x2="360" y2="260"/>
</g>

<!-- meristematic region: small cells -->
<rect x="240" y="290" width="120" height="100" fill="#fff4e6"/>
<g stroke="#adb5bd" stroke-width="1">
<line x1="260" y1="290" x2="260" y2="390"/><line x1="280" y1="290" x2="280" y2="390"/><line x1="300" y1="290" x2="300" y2="390"/><line x1="320" y1="290" x2="320" y2="390"/><line x1="340" y1="290" x2="340" y2="390"/>
<line x1="240" y1="310" x2="360" y2="310"/><line x1="240" y1="330" x2="360" y2="330"/><line x1="240" y1="350" x2="360" y2="350"/><line x1="240" y1="370" x2="360" y2="370"/>
</g>

<!-- root cap -->
<path d="M240,390 H360 C360,435 335,456 300,456 C265,456 240,435 240,390 Z" fill="#f1f3f5"/>
<g stroke="#adb5bd" stroke-width="1" fill="none">
<path d="M240,414 H360"/><path d="M252,436 H348"/><path d="M280,390 V454"/><path d="M320,390 V454"/>
</g>

<!-- root outline and zone boundaries -->
<g stroke="#495057" stroke-width="2" fill="none" stroke-linejoin="round">
<path d="M240,30 V390 C240,435 265,456 300,456 C335,456 360,435 360,390 V30"/>
<line x1="240" y1="200" x2="360" y2="200"/><line x1="240" y1="290" x2="360" y2="290"/><line x1="240" y1="390" x2="360" y2="390"/>
</g>

<!-- root hairs -->
<g stroke="#2f9e44" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M240,52 Q222,50 206,37"/><path d="M240,94 Q222,92 206,79"/><path d="M240,136 Q222,134 206,121"/><path d="M240,178 Q222,176 206,163"/>
<path d="M360,52 Q378,50 394,37"/><path d="M360,94 Q378,92 394,79"/><path d="M360,136 Q378,134 394,121"/><path d="M360,178 Q378,176 394,163"/>
</g>

<!-- zone brackets (right) -->
<g stroke="#495057" stroke-width="2" fill="none">
<path d="M410,34 H418 V196 H410"/>
<path d="M410,204 H418 V286 H410"/>
<path d="M410,294 H418 V386 H410"/>
<path d="M410,394 H418 V452 H410"/>
</g>
<g font-size="16" fill="#1d2330">
<text x="432" y="120">Zone of maturation</text>
<text x="432" y="250">Zone of elongation</text>
<text x="432" y="336" fill="#002b80" font-weight="600">Meristematic region</text>
<text x="432" y="358" font-size="15">(mitosis happens here)</text>
<text x="432" y="428">Root cap</text>
</g>

<!-- root hairs label (left) -->
<text x="160" y="76" text-anchor="end">Root hairs</text>
<line x1="166" y1="72" x2="213" y2="84" stroke="#495057" stroke-width="1.5"/>
<circle cx="213" cy="84" r="2.5" fill="#495057"/>
</svg>
