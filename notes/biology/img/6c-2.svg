<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- gel -->
  <rect x="190" y="84" width="346" height="300" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>

  <!-- wells -->
  <g fill="#495057">
    <rect x="212" y="94" width="44" height="12"/>
    <rect x="298" y="94" width="44" height="12"/>
    <rect x="384" y="94" width="44" height="12"/>
    <rect x="470" y="94" width="44" height="12"/>
  </g>

  <!-- lane names -->
  <g text-anchor="middle" font-weight="bold" fill="#002b80">
    <text x="234" y="68">marker</text>
    <text x="320" y="68">A</text>
    <text x="406" y="68">B</text>
    <text x="492" y="68">C</text>
  </g>

  <!-- marker lane: fragments of 100 to 1000 base pairs -->
  <g fill="#495057">
    <rect x="212" y="127" width="44" height="6"/>
    <rect x="212" y="137" width="44" height="6"/>
    <rect x="212" y="148" width="44" height="6"/>
    <rect x="212" y="161" width="44" height="6"/>
    <rect x="212" y="176" width="44" height="6"/>
    <rect x="212" y="193" width="44" height="6"/>
    <rect x="212" y="214" width="44" height="6"/>
    <rect x="212" y="242" width="44" height="6"/>
    <rect x="212" y="281" width="44" height="6"/>
    <rect x="212" y="347" width="44" height="6"/>
  </g>

  <!-- sample lanes -->
  <g fill="#002b80">
    <rect x="298" y="154" width="44" height="7"/>
    <rect x="298" y="227" width="44" height="7"/>
    <rect x="384" y="184" width="44" height="7"/>
    <rect x="384" y="290" width="44" height="7"/>
    <rect x="470" y="142" width="44" height="7"/>
    <rect x="470" y="203" width="44" height="7"/>
    <rect x="470" y="259" width="44" height="7"/>
  </g>

  <!-- marker sizes -->
  <g stroke="#495057" stroke-width="1.2">
    <line x1="164" y1="130" x2="210" y2="130"/>
    <line x1="164" y1="196" x2="210" y2="196"/>
    <line x1="164" y1="245" x2="210" y2="245"/>
    <line x1="164" y1="284" x2="210" y2="284"/>
    <line x1="164" y1="350" x2="210" y2="350"/>
  </g>
  <g fill="#495057">
    <circle cx="210" cy="130" r="2.6"/>
    <circle cx="210" cy="196" r="2.6"/>
    <circle cx="210" cy="245" r="2.6"/>
    <circle cx="210" cy="284" r="2.6"/>
    <circle cx="210" cy="350" r="2.6"/>
  </g>
  <g text-anchor="end">
    <text x="158" y="135">1000 bp</text>
    <text x="158" y="201">500 bp</text>
    <text x="158" y="250">300 bp</text>
    <text x="158" y="289">200 bp</text>
    <text x="158" y="355">100 bp</text>
  </g>

  <!-- wells label -->
  <line x1="164" y1="100" x2="210" y2="100" stroke="#495057" stroke-width="1.2"/>
  <circle cx="210" cy="100" r="2.6" fill="#495057"/>
  <text x="158" y="105" text-anchor="end">wells</text>

  <!-- direction of movement -->
  <text x="552" y="106">negative electrode</text>
  <line x1="560" y1="122" x2="560" y2="350" stroke="#495057" stroke-width="2" marker-end="url(#ax)"/>
  <text x="574" y="232">shorter fragments</text>
  <text x="574" y="251">travel further</text>
  <text x="552" y="376">positive electrode</text>
</svg>
