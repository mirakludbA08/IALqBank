<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d2330">
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#007bff"/></marker>
<marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7048e8"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f9e44"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- spinal cord in cross-section: white matter outside, grey matter inside -->
<ellipse cx="400" cy="236" rx="132" ry="108" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#495057" stroke-width="38">
<path d="M352,166 V306"/><path d="M448,166 V306"/><path d="M352,236 H448"/>
</g>
<g stroke="#ced4da" stroke-width="34">
<path d="M352,166 V306"/><path d="M448,166 V306"/><path d="M352,236 H448"/>
</g>
</g>
<circle cx="400" cy="236" r="5" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>

<!-- pin, skin and receptor -->
<path d="M70,30 L66,84 L74,84 Z" fill="#868e96" stroke="#495057" stroke-width="1.5" stroke-linejoin="round" transform="rotate(180 70 57)"/>
<ellipse cx="70" cy="26" rx="11" ry="6" fill="#e03131" stroke="#495057" stroke-width="1.5"/>
<rect x="24" y="88" width="176" height="34" rx="6" fill="#fff4e6" stroke="#495057" stroke-width="2"/>
<ellipse cx="146" cy="105" rx="11" ry="8" fill="#e7f0ff" stroke="#007bff" stroke-width="2"/>

<!-- sensory neurone -->
<path d="M157,104 C250,102 352,112 352,206" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arB)"/>
<!-- relay neurone (cell body and axon within the grey matter) -->
<circle cx="352" cy="224" r="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2.5"/>
<path d="M352,232 V264" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" marker-end="url(#arP)"/>
<!-- motor neurone -->
<circle cx="352" cy="284" r="10" fill="#eaf7ee" stroke="#2f9e44" stroke-width="2.5"/>
<path d="M342,288 C300,300 250,340 194,380" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round" marker-end="url(#arG)"/>

<!-- muscle (effector) -->
<path d="M28,392 C68,358 150,358 192,392 C150,426 68,426 28,392 Z" fill="#fdecec" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<g fill="none" stroke="#495057" stroke-width="1.5">
<path d="M52,382 C90,372 130,372 168,382"/><path d="M38,392 H182"/><path d="M52,402 C90,412 130,412 168,402"/>
</g>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.5" fill="none">
<line x1="150" y1="68" x2="146" y2="97"/>
<line x1="168" y1="160" x2="226" y2="106"/>
<line x1="246" y1="228" x2="343" y2="224"/>
<line x1="178" y1="318" x2="271" y2="322"/>
<line x1="552" y1="170" x2="505" y2="210"/>
<line x1="552" y1="300" x2="458" y2="292"/>
</g>
<g fill="#495057"><circle cx="146" cy="97" r="2.5"/><circle cx="226" cy="106" r="2.5"/><circle cx="343" cy="224" r="2.5"/><circle cx="271" cy="322" r="2.5"/><circle cx="505" cy="210" r="2.5"/><circle cx="458" cy="292" r="2.5"/></g>
<text x="90" y="36">Pin (stimulus)</text>
<text x="150" y="62" text-anchor="middle">Receptor</text>
<text x="52" y="174">Sensory neurone</text>
<text x="240" y="234" text-anchor="end">Relay neurone</text>
<text x="46" y="324">Motor neurone</text>
<text x="110" y="448" text-anchor="middle">Muscle (effector)</text>
<text x="558" y="168">White matter</text>
<text x="558" y="306">Grey matter</text>
</svg>
