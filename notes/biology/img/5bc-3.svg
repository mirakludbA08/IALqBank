<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#002b80"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- arrows -->
  <g fill="none" stroke="#002b80" stroke-width="2" marker-end="url(#ah)">
    <!-- up to carbon dioxide -->
    <path d="M68,188 V74"/>
    <path d="M230,188 V74"/>
    <path d="M378,188 V74"/>
    <path d="M516,188 V74"/>
    <path d="M649,188 V74"/>
    <!-- photosynthesis -->
    <path d="M164,74 V188"/>
    <!-- feeding -->
    <path d="M256,232 H316"/>
    <!-- death -->
    <path d="M196,270 V358 H278"/>
    <path d="M378,270 V328"/>
    <!-- decay -->
    <path d="M478,358 H516 V272"/>
    <!-- fossilisation and sedimentation -->
    <path d="M330,388 V420 H68 V272"/>
    <path d="M426,388 V420 H649 V272"/>
  </g>

  <!-- boxes -->
  <g stroke="#495057" stroke-width="2">
    <rect x="16" y="24" width="688" height="48" rx="8" fill="#e7f0ff"/>
    <rect x="16" y="190" width="104" height="80" rx="8" fill="#fff4e6"/>
    <rect x="136" y="190" width="120" height="80" rx="8" fill="#eaf7ee"/>
    <rect x="318" y="190" width="120" height="80" rx="8" fill="#eaf7ee"/>
    <rect x="454" y="190" width="124" height="80" rx="8" fill="#eaf7ee"/>
    <rect x="594" y="190" width="110" height="80" rx="8" fill="#fff4e6"/>
    <rect x="280" y="330" width="196" height="56" rx="8" fill="#f1f3f5"/>
  </g>

  <!-- box text -->
  <g text-anchor="middle">
    <text x="360" y="54" font-size="17" font-weight="700" fill="#002b80">Carbon dioxide in the air and water</text>

    <text x="68" y="226">Fossil</text><text x="68" y="246">fuels</text>

    <text x="196" y="216">Carbon</text><text x="196" y="236">compounds</text><text x="196" y="256">in plants</text>
    <text x="378" y="216">Carbon</text><text x="378" y="236">compounds</text><text x="378" y="256">in animals</text>
    <text x="516" y="216">Carbon</text><text x="516" y="236">compounds in</text><text x="516" y="256">decomposers</text>

    <text x="649" y="226">Carbonate</text><text x="649" y="246">rocks</text>

    <text x="378" y="363">Dead organic matter</text>
  </g>

  <!-- arrow labels on a white backing so the line does not run through the text -->
  <g fill="#ffffff">
    <rect x="112" y="94" width="104" height="22"/>
    <rect x="28" y="134" width="80" height="22"/>
    <rect x="193" y="134" width="74" height="22"/>
    <rect x="341" y="134" width="74" height="22"/>
    <rect x="479" y="134" width="74" height="22"/>
    <rect x="611" y="134" width="76" height="22"/>
  </g>
  <g text-anchor="middle">
    <text x="164" y="110">photosynthesis</text>
    <text x="68" y="150">combustion</text>
    <text x="230" y="150">respiration</text>
    <text x="378" y="150">respiration</text>
    <text x="516" y="150">respiration</text>
    <text x="649" y="150">weathering</text>

    <text x="286" y="222">feeding</text>
    <text x="206" y="312" text-anchor="start">death</text>
    <text x="386" y="306" text-anchor="start">death</text>
    <text x="524" y="316" text-anchor="start">decay</text>
    <text x="199" y="443">fossilisation</text>
    <text x="538" y="443">sedimentation</text>
  </g>
</svg>
