<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="190.0" y="24.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4b3f8f" font-family="Segoe UI, Arial, sans-serif">Rods: convergence</text><rect x="103" y="50" width="14" height="62" rx="6" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.4"/><rect x="106" y="112" width="8" height="20" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.1"/><line x1="110" y1="132" x2="190" y2="200" stroke="#4b3f8f" stroke-width="1.6"/><rect x="143" y="50" width="14" height="62" rx="6" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.4"/><rect x="146" y="112" width="8" height="20" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.1"/><line x1="150" y1="132" x2="190" y2="200" stroke="#4b3f8f" stroke-width="1.6"/><rect x="183" y="50" width="14" height="62" rx="6" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.4"/><rect x="186" y="112" width="8" height="20" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.1"/><line x1="190" y1="132" x2="190" y2="200" stroke="#4b3f8f" stroke-width="1.6"/><rect x="223" y="50" width="14" height="62" rx="6" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.4"/><rect x="226" y="112" width="8" height="20" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.1"/><line x1="230" y1="132" x2="190" y2="200" stroke="#4b3f8f" stroke-width="1.6"/><rect x="263" y="50" width="14" height="62" rx="6" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.4"/><rect x="266" y="112" width="8" height="20" fill="#d7d3ec" stroke="#4b3f8f" stroke-width="1.1"/><line x1="270" y1="132" x2="190" y2="200" stroke="#4b3f8f" stroke-width="1.6"/><circle cx="190" cy="210" r="11" fill="#e6e9ee" stroke="#1b1f23" stroke-width="1.6"/><line x1="190" y1="221" x2="190" y2="265" stroke="#1b1f23" stroke-width="2"/><circle cx="190" cy="276" r="12" fill="#d9efe2" stroke="#1f7a4d" stroke-width="1.6"/><line x1="190" y1="288" x2="190" y2="340" stroke="#1f7a4d" stroke-width="2.4"/><line x1="190.0" y1="330.0" x2="190.0" y2="348.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ahg)"/><text x="40.0" y="80.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">5 rods</text><text x="40.0" y="214.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">1 bipolar cell</text><text x="40.0" y="280.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">1 ganglion cell</text><text x="40.0" y="342.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">1 optic nerve fibre</text><text x="20.0" y="372.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Small generator potentials from many rods add up</text><text x="20.0" y="385.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(spatial summation) and reach threshold in dim light:</text><text x="20.0" y="399.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">HIGH SENSITIVITY. The brain can't tell which rod</text><text x="20.0" y="412.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">was stimulated: LOW ACUITY. Black and white only.</text><text x="560.0" y="24.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b7791f" font-family="Segoe UI, Arial, sans-serif">Cones (fovea): no convergence</text><path d="M491,112 L497,72 L503,72 L509,112 Z" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.4"/><rect x="495" y="112" width="10" height="20" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.1"/><line x1="500" y1="132" x2="500" y2="199" stroke="#b7791f" stroke-width="1.6"/><circle cx="500" cy="210" r="11" fill="#e6e9ee" stroke="#1b1f23" stroke-width="1.6"/><line x1="500" y1="221" x2="500" y2="265" stroke="#1b1f23" stroke-width="2"/><circle cx="500" cy="276" r="12" fill="#d9efe2" stroke="#1f7a4d" stroke-width="1.6"/><line x1="500" y1="288" x2="500" y2="340" stroke="#1f7a4d" stroke-width="2.4"/><line x1="500.0" y1="330.0" x2="500.0" y2="348.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ahg)"/><path d="M551,112 L557,72 L563,72 L569,112 Z" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.4"/><rect x="555" y="112" width="10" height="20" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.1"/><line x1="560" y1="132" x2="560" y2="199" stroke="#b7791f" stroke-width="1.6"/><circle cx="560" cy="210" r="11" fill="#e6e9ee" stroke="#1b1f23" stroke-width="1.6"/><line x1="560" y1="221" x2="560" y2="265" stroke="#1b1f23" stroke-width="2"/><circle cx="560" cy="276" r="12" fill="#d9efe2" stroke="#1f7a4d" stroke-width="1.6"/><line x1="560" y1="288" x2="560" y2="340" stroke="#1f7a4d" stroke-width="2.4"/><line x1="560.0" y1="330.0" x2="560.0" y2="348.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ahg)"/><path d="M611,112 L617,72 L623,72 L629,112 Z" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.4"/><rect x="615" y="112" width="10" height="20" fill="#f6dfb8" stroke="#b7791f" stroke-width="1.1"/><line x1="620" y1="132" x2="620" y2="199" stroke="#b7791f" stroke-width="1.6"/><circle cx="620" cy="210" r="11" fill="#e6e9ee" stroke="#1b1f23" stroke-width="1.6"/><line x1="620" y1="221" x2="620" y2="265" stroke="#1b1f23" stroke-width="2"/><circle cx="620" cy="276" r="12" fill="#d9efe2" stroke="#1f7a4d" stroke-width="1.6"/><line x1="620" y1="288" x2="620" y2="340" stroke="#1f7a4d" stroke-width="2.4"/><line x1="620.0" y1="330.0" x2="620.0" y2="348.0" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ahg)"/><text x="670.0" y="80.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">3 cones</text><text x="670.0" y="214.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">3 bipolar</text><text x="670.0" y="280.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">3 ganglion</text><text x="670.0" y="342.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">3 fibres</text><text x="420.0" y="372.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Each cone has its own route to the brain, so two</text><text x="420.0" y="385.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">points close together are seen separately:</text><text x="420.0" y="399.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">HIGH ACUITY. Needs bright light to reach threshold.</text><text x="420.0" y="412.5" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Three types of cone: colour vision.</text><line x1="380" y1="40" x2="380" y2="390" stroke="#e3e7eb" stroke-width="1.5"/></svg>