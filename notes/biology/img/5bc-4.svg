<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e03131"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- troposphere and surface -->
  <rect x="16" y="150" width="688" height="190" fill="#e7f0ff"/>
  <rect x="16" y="340" width="688" height="84" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="28" y="172" font-weight="700" fill="#002b80">Troposphere</text>
  <text x="32" y="388">Earth’s surface</text>

  <!-- Sun -->
  <g stroke="#f08c00" stroke-width="2" stroke-linecap="round">
    <path d="M62,24 V30"/><path d="M62,90 V96"/><path d="M26,60 H32"/><path d="M92,60 H98"/>
    <path d="M36,34 L40,38"/><path d="M84,82 L88,86"/><path d="M36,86 L40,82"/><path d="M84,38 L88,34"/>
  </g>
  <circle cx="62" cy="60" r="22" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/>
  <text x="62" y="124" text-anchor="middle">Sun</text>

  <!-- cloud -->
  <path d="M340,240 a18,18 0 0 1 8,-34 a22,22 0 0 1 36,-14 a20,20 0 0 1 34,14 a18,18 0 0 1 4,34 Z" fill="#ffffff" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>

  <!-- ultraviolet and visible radiation: absorbed, reflected by the surface, reflected by a cloud -->
  <g fill="none" stroke="#f08c00" stroke-width="3" marker-end="url(#ao)">
    <path d="M110,72 L190,338"/>
    <path d="M170,72 L250,338"/>
    <path d="M250,338 L318,112"/>
    <path d="M349,72 L384,188"/>
    <path d="M384,188 L407,112"/>
  </g>

  <!-- infrared radiation from the surface -->
  <g fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#ar)">
    <path d="M664,338 V66"/>
    <path d="M520,338 V268"/>
  </g>

  <!-- greenhouse gas molecule re-emitting in all directions -->
  <g fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ar)">
    <path d="M506,226 L488,204"/>
    <path d="M534,226 L552,204"/>
    <path d="M506,254 L484,298"/>
    <path d="M534,254 L556,298"/>
  </g>
  <g fill="#f3f0ff" stroke="#7048e8" stroke-width="2">
    <circle cx="507" cy="240" r="7"/><circle cx="533" cy="240" r="7"/><circle cx="520" cy="240" r="8"/>
  </g>

  <!-- labels -->
  <g stroke="#495057" stroke-width="1" fill="none">
    <path d="M318,58 V106"/>
    <path d="M407,58 V106"/>
    <path d="M142,262 L164,262"/>
    <path d="M566,240 L544,240"/>
  </g>
  <text x="262" y="44" text-anchor="middle">Reflected by the surface</text>
  <text x="380" y="44">Reflected by clouds</text>
  <text x="704" y="44" text-anchor="end">Escapes to space</text>
  <text x="24" y="250">Ultraviolet and</text>
  <text x="24" y="270">visible radiation</text>
  <text x="568" y="236">Greenhouse</text>
  <text x="568" y="256">gases</text>
  <text x="652" y="116" text-anchor="end">Infrared radiation</text>
</svg>
