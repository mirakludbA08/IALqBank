<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker></defs><rect x="8" y="8" width="744" height="384" rx="12" fill="#fbfaf6" stroke="#5b6470" stroke-width="1" stroke-dasharray="5 4"/><text x="20.0" y="28.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">CYTOPLASM</text><rect x="350" y="40" width="392" height="342" rx="40" fill="#eef6f1" stroke="#1f7a4d" stroke-width="2.2"/><rect x="358" y="48" width="376" height="326" rx="34" fill="none" stroke="#1f7a4d" stroke-width="1.2"/><text x="546.0" y="66.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f7a4d" font-family="Segoe UI, Arial, sans-serif">MITOCHONDRION: matrix</text><rect x="20" y="92" width="110" height="46" rx="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.2"/><text x="75.0" y="111.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Glucose</text><text x="75.0" y="126.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(6C)</text><rect x="214" y="92" width="118" height="46" rx="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.2"/><text x="273.0" y="111.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2 × pyruvate</text><text x="273.0" y="126.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(3C)</text><rect x="436" y="92" width="116" height="46" rx="7" fill="#ffffff" stroke="#1b1f23" stroke-width="1.2"/><text x="494.0" y="111.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2 × acetyl CoA</text><text x="494.0" y="126.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(2C)</text><circle cx="664" cy="115" r="50" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/><text x="664.0" y="111.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Krebs cycle</text><text x="664.0" y="127.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(turns twice)</text><line x1="132.0" y1="115.0" x2="210.0" y2="115.0" stroke="#1b1f23" stroke-width="1.8" marker-end="url(#ah)"/><text x="171.0" y="106.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">glycolysis</text><line x1="334.0" y1="115.0" x2="432.0" y2="115.0" stroke="#1b1f23" stroke-width="1.8" marker-end="url(#ah)"/><text x="396.0" y="88.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">link</text><text x="396.0" y="101.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">reaction</text><line x1="554.0" y1="115.0" x2="611.0" y2="115.0" stroke="#1b1f23" stroke-width="1.8" marker-end="url(#ah)"/><text x="171.0" y="160.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">2 ATP used, 4 made</text><text x="171.0" y="174.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">(net 2 ATP)</text><text x="171.0" y="188.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">2 reduced NAD</text><text x="494.0" y="160.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">2 CO₂</text><text x="494.0" y="174.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">2 reduced NAD</text><text x="664.0" y="184.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">4 CO₂, 2 ATP</text><text x="664.0" y="198.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">6 reduced NAD</text><text x="664.0" y="212.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">2 reduced FAD</text><rect x="400" y="282" width="320" height="76" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/><text x="560.0" y="301.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Electron transport chain + chemiosmosis</text><text x="560.0" y="316.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">on the inner membrane (cristae)</text><text x="560.0" y="331.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">O₂ + H⁺ + electrons → H₂O</text><text x="560.0" y="346.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">most of the ATP (oxidative phosphorylation)</text><line x1="494.0" y1="186.0" x2="510.0" y2="278.0" stroke="#9a6b00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="664.0" y1="228.0" x2="650.0" y2="278.0" stroke="#9a6b00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M238,180 Q342,196 342,250 L342,300 Q342,318 394,318" fill="none" stroke="#9a6b00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="580.0" y="252.0" font-size="10" font-weight="600" text-anchor="middle" fill="#9a6b00" font-family="Segoe UI, Arial, sans-serif">reduced NAD and reduced FAD carry H to the chain</text><line x1="273.0" y1="140.0" x2="273.0" y2="266.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ahr)"/><text x="266.0" y="236.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">no O₂</text><rect x="30" y="270" width="300" height="88" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.2"/><text x="180.0" y="295.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">No oxygen: pyruvate is reduced</text><text x="180.0" y="310.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">animals: → lactate</text><text x="180.0" y="325.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">yeast, plants: → ethanol + CO₂</text><text x="180.0" y="340.5" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">reduced NAD → NAD, so glycolysis continues</text></svg>