<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fa8"/></marker></defs><clipPath id="bulb"><path d="M162,86 C120,100 104,165 134,205 L166,262 L174,262 L206,205 C236,165 220,100 178,86 Z"/></clipPath><g clip-path="url(#bulb)"><rect x="90" y="120" width="160" height="62" fill="#f6e7b8"/><rect x="90" y="182" width="160" height="90" fill="#dbeaf7"/></g><line x1="90" y1="182" x2="250" y2="182" stroke="#5b6470" stroke-width="1" clip-path="url(#bulb)"/><path d="M162,86 C120,100 104,165 134,205 L166,262 L174,262 L206,205 C236,165 220,100 178,86 Z" fill="none" stroke="#1b1f23" stroke-width="1.6"/><path d="M162,86 L162,58 M178,86 L178,58" stroke="#1b1f23" stroke-width="1.6"/><rect x="159" y="40" width="22" height="20" rx="3" fill="#555"/><path d="M166,262 L166,330 M174,262 L174,330" stroke="#1b1f23" stroke-width="1.6"/><rect x="156" y="276" width="28" height="12" rx="3" fill="#fff" stroke="#1b1f23" stroke-width="1.4"/><rect x="184" y="279" width="22" height="6" rx="2" fill="#555"/><path d="M130,318 L130,385 L210,385 L210,318" fill="none" stroke="#1b1f23" stroke-width="1.6"/><rect x="131" y="362" width="78" height="22" fill="#dbeaf7"/><ellipse cx="170" cy="206" rx="40" ry="5" fill="none" stroke="#5b6470" stroke-width="2"/><line x1="130" y1="206" x2="60" y2="206" stroke="#5b6470" stroke-width="2"/><text x="58.0" y="202.0" font-size="10.5" font-weight="500" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">clamp ring</text><line x1="182.0" y1="50.0" x2="270.0" y2="50.0" stroke="#5b6470" stroke-width="0.9"/><text x="274.0" y="54.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">stopper: remove before running liquid out</text><line x1="210.0" y1="150.0" x2="270.0" y2="136.0" stroke="#5b6470" stroke-width="0.9"/><text x="274.0" y="132.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">upper layer = less dense liquid</text><text x="274.0" y="147.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">e.g. organic product (density below 1 g cm⁻³)</text><line x1="210.0" y1="220.0" x2="270.0" y2="218.0" stroke="#5b6470" stroke-width="0.9"/><text x="274.0" y="214.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">lower layer = denser liquid</text><text x="274.0" y="229.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">e.g. aqueous layer (density ≈ 1 g cm⁻³)</text><line x1="206.0" y1="282.0" x2="270.0" y2="284.0" stroke="#5b6470" stroke-width="0.9"/><text x="274.0" y="288.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">tap: run off the lower layer first</text><text x="274.0" y="318.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">Check the densities given in the question:</text><text x="274.0" y="332.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">a halogenoalkane such as bromoethane (1.47 g cm⁻³)</text><text x="274.0" y="346.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">is denser than water and forms the LOWER layer.</text></svg>