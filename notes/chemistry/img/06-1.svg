<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002b80"/></marker>
</defs>

<!-- boxes -->
<g stroke="#002b80" stroke-width="2">
<rect x="30" y="50" width="230" height="60" rx="8" fill="#f1f3f5"/>
<rect x="460" y="50" width="230" height="60" rx="8" fill="#e7f0ff"/>
<rect x="270" y="290" width="180" height="60" rx="8" fill="#e7f0ff"/>
</g>
<g font-size="17" fill="#1d2330" text-anchor="middle">
<text x="145" y="86">CuSO₄(s) + 5H₂O(l)</text>
<text x="575" y="86">CuSO₄·5H₂O(s)</text>
<text x="360" y="326">CuSO₄(aq)</text>
</g>

<!-- top arrow: hydration -->
<path d="M268,80 H452" stroke="#002b80" stroke-width="2" marker-end="url(#ah)"/>
<text x="360" y="68" font-size="16" fill="#002b80" font-weight="600" text-anchor="middle">ΔH(hydration)</text>

<!-- dissolving arrows -->
<g stroke="#002b80" stroke-width="2" marker-end="url(#ah)">
<path d="M150,114 L296,286"/>
<path d="M570,114 L424,286"/>
</g>
<g font-size="16" fill="#1d2330">
<text x="198" y="188" text-anchor="end">dissolve in water</text>
<text x="198" y="210" text-anchor="end" fill="#002b80" font-weight="600">ΔH = −66.1 kJ mol⁻¹</text>
<text x="522" y="188">dissolve in water</text>
<text x="522" y="210" fill="#002b80" font-weight="600">ΔH = +11 kJ mol⁻¹</text>
</g>
</svg>
