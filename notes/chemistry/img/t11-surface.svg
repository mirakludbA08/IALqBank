"/><text x="360.0" y="138.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">solid catalyst surface</text><text x="360.0" y="20.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">2. Reaction on the surface</text><text x="360.0" y="172.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">atoms are held close together</text><text x="360.0" y="187.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">in a good orientation; lower Ea</text><rect x="490" y="120" width="220" height="26" fill="#cfd6dd" stroke="#1b1f23" stroke-width="1"/><text x="600.0" y="138.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">solid catalyst surface</text><text x="600.0" y="20.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">3. Desorption</text><text x="600.0" y="172.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">the product leaves the surface;</text><text x="600.0" y="187.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">the active site is free again</text><line x1="60.0" y1="60.0" x2="82.0" y2="60.0" stroke="#1b1f23" stroke-width="2.2" /><circle cx="60" cy="60" r="11" fill="#b3261e" opacity="0.9"/><text x="60.0" y="64.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif">A</text><circle cx="82" cy="60" r="11" fill="#b3261e" opacity="0.9"/><text x="82.0" y="64.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif">A</text><line x1="71.0" y1="75.0" x2="71.0" y2="10