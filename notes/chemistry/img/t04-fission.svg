<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" width="640" height="165"><defs><marker id="fh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#b3261e"/></marker><marker id="hh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L1,5 z" fill="#b3261e"/></marker><marker id="rh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#1b1f23"/></marker></defs><line x1="320.0" y1="15.0" x2="320.0" y2="150.0" stroke="#e3e7eb" stroke-width="1" stroke-linecap="round"/><text x="160.0" y="24.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">Homolytic fission</text><line x1="101.5" y1="85.0" x2="158.4" y2="85.0" stroke="#1b1f23" stroke-width="1.6" stroke-linecap="round"/><text x="92.0" y="90.4" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Cl</text><text x="168.0" y="90.4" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Cl</text><path d="M126.0,81.0 Q105.2,91.3 94.0,71.0" fill="none" stroke="#b3261e" stroke-width="1.6" marker-end="url(#hh)"/><path d="M134.0,81.0 Q154.8,91.3 166.0,71.0" fill="none" stroke="#b3261e" stroke-width="1.6" marker-end="url(#hh)"/><line x1="195" y1="85" x2="235" y2="85" stroke="#1b1f23" stroke-width="1.6" marker-end="url(#rh)"/><text x="275.0" y="90.0" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">2Cl•</text><text x="160.0" y="128.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">each atom keeps one electron of the pair</text><text x="160.0" y="146.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">→ two free radicals (Cl₂ needs UV light)</text><text x="480.0" y="24.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">Heterolytic fission</text><line x1="382.3" y1="85.0" x2="422.9" y2="85.0" stroke="#1b1f23" stroke-width="1.6" stroke-linecap="round"/><text x="375.0" y="90.4" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">H</text><text x="435.0" y="90.4" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Br</text><text x="375.0" y="112.0" font-size="12" font-weight="500" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">δ+</text><text x="435.0" y="112.0" font-size="12" font-weight="500" text-anchor="middle" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">δ−</text><path d="M405.0,80.0 Q423.7,88.2 433.0,70.0" fill="none" stroke="#b3261e" stroke-width="1.6" marker-end="url(#fh)"/><line x1="470" y1="85" x2="510" y2="85" stroke="#1b1f23" stroke-width="1.6" marker-end="url(#rh)"/><text x="565.0" y="90.0" font-size="15" font-weight="500" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">H⁺ + Br⁻</text><text x="480.0" y="128.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">the more electronegative atom (Br) takes</text><text x="480.0" y="146.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">both electrons → two ions</text></svg>