<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="cu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fa8"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker></defs><defs><clipPath id="fb"><path d="M188,60 C120,110 105,190 188,250 L212,250 C295,190 280,110 212,60 Z"/></clipPath></defs><rect x="100" y="120" width="200" height="62" fill="#f4d58d" fill-opacity="0.75" clip-path="url(#fb)"/><rect x="100" y="182" width="200" height="80" fill="#1d5fa8" fill-opacity="0.28" clip-path="url(#fb)"/><path d="M188,60 C120,110 105,190 188,250 L212,250 C295,190 280,110 212,60 Z" fill="none" stroke="#1b1f23" stroke-width="1.8"/><rect x="188" y="40" width="24" height="20" fill="#f6f8fa" stroke="#1b1f23" stroke-width="1.6"/><rect x="184" y="26" width="32" height="16" rx="4" fill="#cfd6dd" stroke="#1b1f23" stroke-width="1.4"/><rect x="195" y="250" width="10" height="80" fill="#f6f8fa" stroke="#1b1f23" stroke-width="1.6"/><rect x="178" y="276" width="44" height="12" rx="3" fill="#cfd6dd" stroke="#1b1f23" stroke-width="1.4"/><path d="M160,330 L160,372 L240,372 L240,330" fill="none" stroke="#1b1f23" stroke-width="1.6"/><text x="320.0" y="38.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">stopper: remove before running off the lower layer</text><text x="320.0" y="154.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">upper layer = less dense liquid</text><text x="320.0" y="170.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(e.g. an organic layer in ether)</text><text x="320.0" y="219.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">lower layer = denser liquid</text><text x="320.0" y="235.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">(often the aqueous layer)</text><text x="320.0" y="288.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">tap: run off the lower layer</text><line x1="218.0" y1="34.0" x2="314.0" y2="34.0" stroke="#5b6470" stroke-width="1"/><line x1="270.0" y1="150.0" x2="314.0" y2="150.0" stroke="#5b6470" stroke-width="1"/><line x1="270.0" y1="215.0" x2="314.0" y2="215.0" stroke="#5b6470" stroke-width="1"/><line x1="224.0" y1="284.0" x2="314.0" y2="284.0" stroke="#5b6470" stroke-width="1"/><text x="20.0" y="140.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">Shake, invert,</text><text x="20.0" y="156.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">open tap to vent</text><text x="20.0" y="172.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#b3261e" font-family="Segoe UI, Arial, sans-serif">(CO₂ from Na₂CO₃)</text><text x="320.0" y="340.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">Not sure which layer is which?</text><text x="320.0" y="356.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#1d5fa8" font-family="Segoe UI, Arial, sans-serif">Add a little water and see which one grows.</text></svg>