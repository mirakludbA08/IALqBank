<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
<defs>
<clipPath id="tube"><path d="M235 90 V300 A125 125 0 0 0 485 300 V90 H435 V300 A75 75 0 0 1 285 300 V90 Z"/></clipPath>
<marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b25e00"/></marker>
<marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b4f9c"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- liquids inside the U-tube -->
<g clip-path="url(#tube)">
<rect x="225" y="130" width="270" height="300" fill="#f1f6fb"/>
<rect x="225" y="270" width="270" height="160" fill="#86d296"/>
<rect x="235" y="205" width="50" height="65" fill="#ffe066"/>
<rect x="435" y="185" width="50" height="85" fill="#74c0fc"/>
</g>
<line x1="235" y1="130" x2="285" y2="130" stroke="#495057" stroke-width="1.2"/>
<line x1="435" y1="130" x2="485" y2="130" stroke="#495057" stroke-width="1.2"/>

<!-- glass walls -->
<g fill="none" stroke="#495057" stroke-width="2.5" stroke-linecap="round">
<path d="M235 90 V300 A125 125 0 0 0 485 300 V90"/>
<path d="M285 90 V300 A75 75 0 0 0 435 300 V90"/>
</g>

<!-- electrodes, wires and d.c. supply -->
<g fill="#868e96" stroke="#495057" stroke-width="1.8">
<rect x="253" y="56" width="14" height="129"/>
<rect x="453" y="56" width="14" height="129"/>
</g>
<g fill="none" stroke="#1d2330" stroke-width="2">
<path d="M260 56 V38 H337"/>
<path d="M353 38 H460 V56"/>
</g>
<line x1="337" y1="24" x2="337" y2="52" stroke="#1d2330" stroke-width="2.5"/>
<line x1="353" y1="30" x2="353" y2="46" stroke="#1d2330" stroke-width="5"/>
<text x="345" y="74" text-anchor="middle">d.c. supply</text>

<!-- directions of movement -->
<line x1="268" y1="262" x2="268" y2="214" stroke="#b25e00" stroke-width="2.6" marker-end="url(#ay)"/>
<line x1="452" y1="262" x2="452" y2="194" stroke="#0b4f9c" stroke-width="2.6" marker-end="url(#abl)"/>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.2" fill="#495057">
<line x1="228" y1="104" x2="254" y2="104"/><circle cx="254" cy="104" r="2.5" stroke="none"/>
<line x1="226" y1="245" x2="244" y2="245"/><circle cx="244" cy="245" r="2.5" stroke="none"/>
<line x1="192" y1="372" x2="292" y2="372"/><circle cx="292" cy="372" r="2.5" stroke="none"/>
<line x1="492" y1="104" x2="466" y2="104"/><circle cx="466" cy="104" r="2.5" stroke="none"/>
<line x1="496" y1="160" x2="478" y2="160"/><circle cx="478" cy="160" r="2.5" stroke="none"/>
<line x1="498" y1="230" x2="478" y2="230"/><circle cx="478" cy="230" r="2.5" stroke="none"/>
</g>
<text x="222" y="109" text-anchor="end">positive electrode (+)</text>
<text x="220" y="250" text-anchor="end">yellow CrO₄²⁻</text>
<text x="186" y="372" text-anchor="end">copper(II) chromate(VI)</text>
<text x="186" y="392" text-anchor="end">solution (green)</text>
<text x="498" y="109">negative electrode (−)</text>
<text x="502" y="165">colourless electrolyte</text>
<text x="504" y="235">blue Cu²⁺</text>
</svg>
