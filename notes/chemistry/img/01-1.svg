<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d2330">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007bff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0,-50)">

<!-- bench -->
<line x1="110" y1="398" x2="550" y2="398" stroke="#495057" stroke-width="2.5"/>

<!-- tripod: legs and ring -->
<g stroke="#495057" stroke-width="4.5" stroke-linecap="round" fill="none">
<line x1="222" y1="232" x2="170" y2="396"/>
<line x1="438" y1="232" x2="490" y2="396"/>
</g>
<ellipse cx="330" cy="226" rx="125" ry="13" fill="none" stroke="#495057" stroke-width="4.5"/>

<!-- burner and flame -->
<rect x="320" y="318" width="20" height="56" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<rect x="316" y="338" width="28" height="10" fill="#e7f0ff" stroke="#495057" stroke-width="1.6"/>
<rect x="296" y="374" width="68" height="18" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<path d="M330 250 C340 270 346 290 342 306 C340 314 334 318 330 318 C326 318 320 314 318 306 C314 290 320 270 330 250 Z" fill="#ffe8cc" stroke="#f08c00" stroke-width="1.8"/>

<!-- pipeclay triangle: back sides, crucible, front side -->
<g stroke-linecap="round" fill="none">
<line x1="248" y1="231" x2="330" y2="216" stroke="#495057" stroke-width="10"/>
<line x1="412" y1="231" x2="330" y2="216" stroke="#495057" stroke-width="10"/>
<line x1="248" y1="231" x2="330" y2="216" stroke="#ffe8cc" stroke-width="6.5"/>
<line x1="412" y1="231" x2="330" y2="216" stroke="#ffe8cc" stroke-width="6.5"/>
</g>

<!-- crucible with loose lid -->
<path d="M286 150 L374 150 L358 238 Q357 246 349 246 H311 Q303 246 302 238 Z" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<g stroke-linecap="round" fill="none">
<line x1="248" y1="231" x2="412" y2="231" stroke="#495057" stroke-width="10"/>
<line x1="248" y1="231" x2="412" y2="231" stroke="#ffe8cc" stroke-width="6.5"/>
</g>
<polygon points="282,144 378,134 378,140 282,150" fill="#e7f0ff" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>

<!-- water vapour -->
<line x1="386" y1="136" x2="424" y2="96" stroke="#007bff" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="432" y="100" fill="#002b80">water vapour escapes</text>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.2" fill="#495057">
<line x1="200" y1="146" x2="292" y2="146"/><circle cx="292" cy="146" r="2.5" stroke="none"/>
<line x1="192" y1="196" x2="296" y2="196"/><circle cx="296" cy="196" r="2.5" stroke="none"/>
<line x1="466" y1="204" x2="416" y2="228"/><circle cx="416" cy="228" r="2.5" stroke="none"/>
<line x1="66" y1="326" x2="192" y2="326"/><circle cx="192" cy="326" r="2.5" stroke="none"/>
<line x1="386" y1="282" x2="341" y2="282"/><circle cx="341" cy="282" r="2.5" stroke="none"/>
</g>
<text x="192" y="151" text-anchor="end">loose lid</text>
<text x="184" y="201" text-anchor="end">crucible</text>
<text x="472" y="205">pipeclay triangle</text>
<text x="16" y="331">tripod</text>
<text x="392" y="287">flame</text>
</g>
</svg>
