<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007bff"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002b80"/></marker>
</defs>

<!-- LEFT: two separate p orbitals, one on each carbon -->
<g fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-linejoin="round">
<path d="M70,200 C16,172 18,92 70,90 C122,92 124,172 70,200 Z"/>
<path d="M70,200 C16,228 18,308 70,310 C122,308 124,228 70,200 Z"/>
<path d="M240,200 C186,172 188,92 240,90 C292,92 294,172 240,200 Z"/>
<path d="M240,200 C186,228 188,308 240,310 C292,308 294,228 240,200 Z"/>
</g>
<path d="M83,200 H227" stroke="#002b80" stroke-width="4"/>
<g fill="#f1f3f5" stroke="#495057" stroke-width="2">
<circle cx="70" cy="200" r="13"/>
<circle cx="240" cy="200" r="13"/>
</g>
<g font-size="15" fill="#1d2330" text-anchor="middle">
<text x="70" y="205">C</text>
<text x="240" y="205">C</text>
</g>
<!-- p orbitals moving together -->
<g stroke="#007bff" stroke-width="2.5" marker-end="url(#ah)">
<path d="M118,138 H146"/>
<path d="M192,138 H164"/>
<path d="M118,262 H146"/>
<path d="M192,262 H164"/>
</g>

<!-- arrow between the two pictures -->
<path d="M300,200 H350" stroke="#002b80" stroke-width="3" marker-end="url(#ahd)"/>

<!-- RIGHT: overlapped p orbitals form the pi bond above and below the sigma bond -->
<g fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-linejoin="round">
<path d="M410,200 C376,176 374,92 416,90 C450,88 465,100 495,100 C525,100 540,88 574,90 C616,92 614,176 580,200 C548,160 442,160 410,200 Z"/>
<path d="M410,200 C376,224 374,308 416,310 C450,312 465,300 495,300 C525,300 540,312 574,310 C616,308 614,224 580,200 C548,240 442,240 410,200 Z"/>
</g>
<path d="M423,200 H567" stroke="#002b80" stroke-width="4"/>
<g fill="#f1f3f5" stroke="#495057" stroke-width="2">
<circle cx="410" cy="200" r="13"/>
<circle cx="580" cy="200" r="13"/>
</g>
<g font-size="15" fill="#1d2330" text-anchor="middle">
<text x="410" y="205">C</text>
<text x="580" y="205">C</text>
</g>

<!-- labels with leader lines -->
<g stroke="#495057" stroke-width="1.5" fill="none">
<path d="M42,78 L56,108"/>
<path d="M155,324 V203"/>
<path d="M495,324 V203"/>
<path d="M642,199 L610,148"/>
<path d="M642,211 L610,252"/>
</g>
<g font-size="16" fill="#1d2330">
<text x="16" y="72">p orbital</text>
<text x="155" y="346" text-anchor="middle">σ bond</text>
<text x="495" y="346" text-anchor="middle">σ bond</text>
<text x="646" y="211" fill="#002b80" font-weight="600">π bond</text>
</g>
</svg>
