<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question bank · IALqBank</title>
    <meta name="description" content="Past-paper questions for Pearson Edexcel International AS and A Level Physics and Chemistry, sorted by Unit, topic and specification point, with notes on how each question is asked and what the mark scheme rewards.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css?v=20261102-1">
    <link rel="stylesheet" href="css/bank.css?v=20261102-1">
    <link rel="stylesheet" href="css/topicbank.css?v=20261102-1">
    <script src="js/theme.js?v=20261102-1"></script>
</head>
<body class="bank topicbank" data-subject="physics">
    <header class="bank-top">
        <a class="bank-logo" href="index.html">IALqBank</a>
        <nav class="subject-tabs" aria-label="Subjects"></nav>
    </header>

    <main class="tb-main">
        <section class="bank-intro">
            <h1 id="subject-title">Question bank</h1>
            <p id="subject-blurb"><span id="blurb-count">Loading the question bank.</span> Each item is a screenshot from the paper with notes on how it is asked, what the mark scheme rewards, where the paper is and what to do first.</p>
        </section>

        <p id="loading" class="tb-status">Loading questions…</p>
        <p id="soon" class="tb-status" hidden></p>

        <div id="app" class="tb-layout" hidden>
            <button id="topics-toggle" class="tb-topics-toggle" type="button">Topics</button>
            <aside id="sidebar" class="tb-sidebar" aria-label="Topics">
                <h2>Topics</h2>
                <div id="tree" class="tb-tree"></div>
            </aside>

            <section class="tb-content" aria-label="Questions">
                <div class="tb-controls">
                    <label class="tb-field tb-search">
                        <span>Search</span>
                        <input id="f-search" type="search" placeholder="A topic, command word or any word from the notes" autocomplete="off">
                    </label>
                    <label class="tb-field"><span>Unit</span>
                        <select id="f-unit"><option value="">All units</option></select>
                    </label>
                    <label class="tb-field"><span>Year</span>
                        <select id="f-year"><option value="">All years</option></select>
                    </label>
                    <label class="tb-field"><span>Marks</span>
                        <select id="f-marks">
                            <option value="">Any</option>
                            <option value="1">1 (multiple choice)</option>
                            <option value="2-4">2 to 4</option>
                            <option value="5-8">5 to 8</option>
                            <option value="9+">9 or more</option>
                        </select>
                    </label>
                    <label class="tb-field"><span>Sort</span>
                        <select id="f-sort">
                            <option value="new">Newest first</option>
                            <option value="old">Oldest first</option>
                            <option value="marks">Most marks</option>
                            <option value="name">Name A to Z</option>
                        </select>
                    </label>
                    <label class="tb-check"><input id="f-hide" type="checkbox"> Hide the ones I have done</label>
                </div>
                <p id="count" class="tb-count" aria-live="polite"></p>
                <button id="back" class="tb-back" type="button" hidden>Back to the list</button>
                <div id="qlist" class="tb-list"></div>
                <p id="empty" class="tb-status" hidden>Nothing matches those filters.</p>
                <button id="more" class="tb-more" type="button" hidden>Show more</button>
            </section>
        </div>
    </main>

    <script src="js/topicbank.js?v=20261102-1"></script>
</body>
</html>
