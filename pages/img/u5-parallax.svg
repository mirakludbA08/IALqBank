fb8"/><text x="410.0" y="272.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d6fb8" font-family="Segoe UI, Arial, sans-serif">Earth (July)</text><line x1="410.0" y1="250.0" x2="234.0" y2="30.0" stroke="#1d6fb8" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="270.0" y1="250.0" x2="270.0" y2="75.0" stroke="#1b1f23" stroke-width="1.2"/><line x1="410.0" y1="250.0" x2="270.0" y2="75.0" stroke="#1b1f23" stroke-width="1.6"/><line x1="270.0" y1="250.0" x2="410.0" y2="250.0" stroke="#1b1f23" stroke-width="1.6"/><circle cx="270" cy="75" r="5.5" fill="#a3361f"/><text x="260.0" y="79.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">nearby star</text><path d="M270,236 L284,236 L284,250" fill="none" stroke="#1b1f23" stroke-width="1"/><text x="340.0" y="244.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">r = 1 AU</text><text x="264.0" y="172.5" font-size="13" font-weight="600" text-anchor="end" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">d</text><path d="M270,109 A34,34 0 0 0 291.2,101.5" fill="none" stroke="#a3361f" stroke-width="1.6"/><text x="280.0" y="123.0" font-size="13" font-weight="600" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">p</text><text x="470.0" y="120.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">tan p = r / d</text><text x="470.0" y="138.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">p is half the total</text><text x="470.0" y="152.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">6-month shift</text></svg>