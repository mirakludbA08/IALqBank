<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect x="120" y="50" width="70" height="260" fill="#fdf3d8"/><path d="M120,20 L120,310 L190,310 L190,20" fill="none" stroke="#1b1f23" stroke-width="1.8"/><text x="155.0" y="302.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">liquid</text><circle cx="155.0" cy="80" r="5" fill="#6b7785"/><text x="202.0" y="84.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">ball released at the centre of the surface</text><rect x="117" y="147" width="76" height="6" fill="#a3361f" opacity="0.85"/><text x="110.0" y="154.0" font-size="12" font-weight="700" text-anchor="end" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">A</text><rect x="117" y="212" width="76" height="6" fill="#a3361f" opacity="0.85"/><text x="110.0" y="219.0" font-size="12" font-weight="700" text-anchor="end" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">B</text><rect x="117" y="277" width="76" height="6" fill="#a3361f" opacity="0.85"/><text x="110.0" y="284.0" font-size="12" font-weight="700" text-anchor="end" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">C</text><line x1="210.0" y1="150.0" x2="210.0" y2="215.0" stroke="#444" stroke-width="1.2" marker-end="url(#ah)" marker-start="url(#ah)"/><line x1="210.0" y1="215.0" x2="210.0" y2="280.0" stroke="#444" stroke-width="1.2" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="220.0" y="186.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">equal distances, e.g. 10.0 cm</text><text x="220.0" y="252.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">time A→B and B→C</text><text x="220.0" y="266.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">equal times ⇒ terminal velocity</text><text x="202.0" y="110.0" font-size="10" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">band A well below the surface,</text><text x="202.0" y="123.0" font-size="10" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">so the ball has stopped accelerating</text><text x="110.0" y="128.0" font-size="10" font-weight="500" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">rubber</text><text x="110.0" y="140.0" font-size="10" font-weight="500" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">bands</text></svg>