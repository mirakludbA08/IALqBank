<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><text x="20.0" y="22.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(a) Mass on a spring</text><rect x="14" y="362" width="110" height="10" fill="#d9dde2" stroke="#1b1f23"/><rect x="51" y="50" width="6" height="312" fill="#d9dde2" stroke="#1b1f23"/><rect x="47" y="56" width="14" height="14" fill="#9aa3ad" stroke="#1b1f23"/><rect x="61" y="60" width="166" height="6" fill="#d9dde2" stroke="#1b1f23"/><path d="M214.0,66.0 L214.0,74.0 L223.0,76.2 L205.0,80.5 L223.0,84.9 L205.0,89.3 L223.0,93.6 L205.0,98.0 L223.0,102.4 L205.0,106.7 L223.0,111.1 L205.0,115.5 L223.0,119.8 L205.0,124.2 L223.0,128.5 L205.0,132.9 L223.0,137.3 L205.0,141.6 L223.0,146.0 L205.0,150.4 L223.0,154.7 L205.0,159.1 L223.0,163.5 L205.0,167.8 L214.0,170.0 L214.0,178.0" fill="none" stroke="#1b1f23" stroke-width="1.5"/><rect x="196" y="178" width="36" height="50" rx="3" fill="#c9ced4" stroke="#1b1f23"/><line x1="196.0" y1="190.0" x2="232.0" y2="190.0" stroke="#8b939c" stroke-width="1" /><line x1="196.0" y1="202.0" x2="232.0" y2="202.0" stroke="#8b939c" stroke-width="1" /><line x1="196.0" y1="214.0" x2="232.0" y2="214.0" stroke="#8b939c" stroke-width="1" /><line x1="180.0" y1="198.0" x2="248.0" y2="198.0" stroke="#5b6470" stroke-width="1" stroke-dasharray="4 3"/><text x="174.0" y="202.0" font-size="10" font-weight="500" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">highest point</text><line x1="180.0" y1="258.0" x2="248.0" y2="258.0" stroke="#5b6470" stroke-width="1" stroke-dasharray="4 3"/><text x="174.0" y="262.0" font-size="10" font-weight="500" text-anchor="end" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">lowest point</text><line x1="258.0" y1="200.0" x2="258.0" y2="256.0" stroke="#444" stroke-width="1.2" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="293" y="222" width="6" height="140" fill="#d9dde2" stroke="#1b1f23"/><rect x="266" y="362" width="60" height="10" fill="#d9dde2" stroke="#1b1f23"/><path d="M293,224 L238,228 L293,232 z" fill="#a3361f" stroke="#a3361f"/><line x1="184.0" y1="228.0" x2="238.0" y2="228.0" stroke="#a3361f" stroke-width="1.6" /><text x="304.0" y="206.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">fiducial marker</text><text x="304.0" y="220.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">level with the bottom</text><text x="304.0" y="233.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">of the mass at rest</text><text x="304.0" y="246.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">(equilibrium position)</text><text x="440.0" y="22.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(b) Simple pendulum</text><rect x="420" y="362" width="110" height="10" fill="#d9dde2" stroke="#1b1f23"/><rect x="457" y="50" width="6" height="312" fill="#d9dde2" stroke="#1b1f23"/><rect x="453" y="56" width="14" height="14" fill="#9aa3ad" stroke="#1b1f23"/><rect x="467" y="60" width="146" height="6" fill="#d9dde2" stroke="#1b1f23"/><rect x="600" y="56" width="20" height="12" fill="#9aa3ad" stroke="#1b1f23"/><text x="610.0" y="44.0" font-size="10" font-weight="500" text-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">string clamped between two small plates</text><line x1="610.0" y1="66.0" x2="610.0" y2="286.0" stroke="#5b6470" stroke-width="1" stroke-dasharray="4 3"/><line x1="610.0" y1="66.0" x2="656.0" y2="250.4" stroke="#1b1f23" stroke-width="1.3" /><circle cx="656.0" cy="250.4" r="11" fill="#c9ced4" stroke="#1b1f23"/><line x1="610.0" y1="66.0" x2="564.0" y2="250.4" stroke="#aab2bb" stroke-width="1" stroke-dasharray="3 3"/><circle cx="564.0" cy="250.4" r="11" fill="none" stroke="#aab2bb" stroke-dasharray="3 3"/><path d="M558.7,271.7 A212,212 0 0 0 661.3,271.7" fill="none" stroke="#444" stroke-width="1.1" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M610,112 A46,46 0 0 0 621.1,110.6" fill="none" stroke="#5b6470" stroke-width="1"/><text x="632.0" y="128.0" font-size="10" font-weight="500" text-anchor="start" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">angle under about 10°</text><path d="M610,282 L603,296 L617,296 z" fill="#a3361f" stroke="#a3361f"/><rect x="586" y="296" width="48" height="7" fill="#d9dde2" stroke="#1b1f23"/><text x="610.0" y="320.0" font-size="11" font-weight="700" text-anchor="middle" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">fiducial marker directly below the pivot</text><text x="610.0" y="334.0" font-size="10.5" font-weight="500" text-anchor="middle" fill="#a3361f" font-family="Segoe UI, Arial, sans-serif">(the centre of the swing)</text><text x="20.0" y="394.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Start the stopwatch as the mass (or bob) passes the marker, after a few oscillations have settled. Time 20 oscillations: T = t / 20.</text><text x="20.0" y="408.0" font-size="10.5" font-weight="500" text-anchor="start" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">Repeat the timing and take the mean of t. The marker is where the object moves fastest, so the moment it passes is easiest to judge.</text></svg>