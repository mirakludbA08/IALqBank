xt-anchor="middle" fill="#5b6470" font-family="Segoe UI, Arial, sans-serif">Δv points to the centre</text><text x="560.0" y="262.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23" font-family="Segoe UI, Arial, sans-serif">(c) vB − vA = Δv</text></svg>